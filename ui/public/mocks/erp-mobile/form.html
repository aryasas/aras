<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile-First Form (Expo Ready)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        ios: { bg: '#F2F2F7', card: '#FFFFFF', blue: '#007AFF', gray: '#8E8E93', border: '#C6C6C8', text: '#000000' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-ios-text antialiased h-screen flex justify-center overflow-hidden">

    <!-- App Container -->
    <div class="w-full max-w-md h-full bg-ios-bg relative flex flex-col shadow-2xl overflow-hidden sm:border-x sm:border-gray-800">
        
        <!-- Native Stack Header -->
        <header class="bg-white/90 backdrop-blur-md border-b border-ios-border pt-12 pb-3 px-4 sticky top-0 z-20 shrink-0 flex items-center justify-between">
            <a href="index.html" class="flex items-center text-ios-blue text-[17px]">
                <i data-lucide="chevron-left" class="w-6 h-6 -ml-2"></i>
                <span>Back</span>
            </a>
            <h1 class="text-[17px] font-semibold">INV-24-092</h1>
            <button class="text-ios-blue text-[17px] font-semibold">Save</button>
        </header>

        <!-- Scrollable Form Content -->
        <main class="flex-1 overflow-y-auto pb-8 space-y-6 pt-6">
            
            <!-- Section 1: Client -->
            <section class="px-4">
                <h2 class="text-[13px] font-medium text-ios-gray uppercase tracking-wider mb-2 pl-4">Client Information</h2>
                <div class="bg-white rounded-xl overflow-hidden">
                    <div class="flex items-center justify-between p-4 border-b border-ios-border/50">
                        <span class="text-[17px]">Customer</span>
                        <div class="flex items-center text-ios-gray">
                            <span class="text-[17px]">Acme Corp</span>
                            <i data-lucide="chevron-right" class="w-5 h-5 ml-1"></i>
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-4">
                        <span class="text-[17px]">Email</span>
                        <input type="email" value="billing@acme.corp" class="text-right text-[17px] text-ios-blue outline-none bg-transparent">
                    </div>
                </div>
            </section>

            <!-- Section 2: Dates -->
            <section class="px-4">
                <h2 class="text-[13px] font-medium text-ios-gray uppercase tracking-wider mb-2 pl-4">Dates</h2>
                <div class="bg-white rounded-xl overflow-hidden">
                    <div class="flex items-center justify-between p-4 border-b border-ios-border/50">
                        <span class="text-[17px]">Issue Date</span>
                        <input type="date" value="2024-10-24" class="text-right text-[17px] text-ios-gray outline-none bg-transparent">
                    </div>
                    <div class="flex items-center justify-between p-4">
                        <span class="text-[17px]">Due Date</span>
                        <input type="date" value="2024-11-24" class="text-right text-[17px] text-ios-gray outline-none bg-transparent">
                    </div>
                </div>
            </section>

            <!-- Section 3: Line Items (Mobile optimized) -->
            <section class="px-4">
                <div class="flex items-center justify-between mb-2 pl-4 pr-2">
                    <h2 class="text-[13px] font-medium text-ios-gray uppercase tracking-wider">Line Items</h2>
                    <button class="text-ios-blue text-[13px] font-medium">Add Row</button>
                </div>
                
                <div class="bg-white rounded-xl overflow-hidden divide-y divide-ios-border/50">
                    <!-- Item 1 -->
                    <div class="p-4">
                        <div class="flex justify-between mb-2">
                            <input type="text" value="Enterprise License" class="text-[17px] font-medium outline-none bg-transparent w-full">
                        </div>
                        <div class="flex justify-between items-center text-ios-gray">
                            <div class="flex items-center gap-2">
                                <span class="text-[15px]">Qty:</span>
                                <input type="number" value="1" class="w-12 border border-ios-border rounded text-center px-1 py-0.5 outline-none text-[15px]">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[15px]">$</span>
                                <input type="text" value="3500.00" class="w-20 text-right outline-none text-[15px]">
                            </div>
                        </div>
                    </div>
                    <!-- Item 2 -->
                    <div class="p-4">
                        <div class="flex justify-between mb-2">
                            <input type="text" value="Support Hours" class="text-[17px] font-medium outline-none bg-transparent w-full">
                        </div>
                        <div class="flex justify-between items-center text-ios-gray">
                            <div class="flex items-center gap-2">
                                <span class="text-[15px]">Qty:</span>
                                <input type="number" value="5" class="w-12 border border-ios-border rounded text-center px-1 py-0.5 outline-none text-[15px]">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[15px]">$</span>
                                <input type="text" value="140.00" class="w-20 text-right outline-none text-[15px]">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Section 4: Totals -->
            <section class="px-4">
                <div class="bg-white rounded-xl overflow-hidden p-4 space-y-2">
                    <div class="flex justify-between text-[15px] text-ios-gray">
                        <span>Subtotal</span>
                        <span>$4,200.00</span>
                    </div>
                    <div class="flex justify-between text-[15px] text-ios-gray">
                        <span>Tax</span>
                        <span>$0.00</span>
                    </div>
                    <div class="pt-2 mt-2 border-t border-ios-border/50 flex justify-between text-[17px] font-semibold">
                        <span>Total</span>
                        <span>$4,200.00</span>
                    </div>
                </div>
            </section>

            <!-- Native destructive action -->
            <section class="px-4 pt-4 pb-8">
                <button class="w-full bg-white rounded-xl p-4 text-center text-red-500 font-semibold text-[17px]">
                    Delete Invoice
                </button>
            </section>

        </main>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
