<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expo Web Form (Responsive)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        ios: { bg: '#F2F2F7', card: '#FFFFFF', blue: '#007AFF', gray: '#8E8E93', border: '#C6C6C8', text: '#000000' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F2F2F7; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-ios-text antialiased h-screen flex overflow-hidden">

    <!-- Desktop Side Rail Navigation (Hidden on Mobile, visible on Web) -->
    <nav class="hidden md:flex flex-col w-[80px] bg-white border-r border-gray-200 z-30 shrink-0">
        <div class="h-20 flex items-center justify-center shrink-0">
            <div class="w-10 h-10 bg-ios-blue text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-sm">E</div>
        </div>
        <div class="flex-1 flex flex-col items-center gap-8 pt-8">
            <a href="index.html" class="flex flex-col items-center justify-center text-gray-400 hover:text-gray-600 gap-1 group">
                <i data-lucide="layout-dashboard" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <button class="flex flex-col items-center justify-center text-ios-blue gap-1 group">
                <i data-lucide="file-text" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-medium">Invoice</span>
            </button>
        </div>
        <div class="pb-6 flex justify-center">
            <img src="https://ui-avatars.com/api/?name=Aras&background=E5E5EA&color=007AFF" class="w-10 h-10 rounded-full" alt="Profile">
        </div>
    </nav>

    <!-- App Container -->
    <div class="flex-1 flex flex-col relative overflow-hidden bg-ios-bg">
        
        <!-- Header (Native Stack on Mobile, Clean Topbar on Desktop) -->
        <header class="bg-white/90 md:bg-ios-bg backdrop-blur-md md:backdrop-filter-none border-b border-ios-border/50 md:border-none pt-12 md:pt-8 pb-3 md:pb-4 px-4 md:px-8 sticky top-0 z-20 shrink-0 flex items-center justify-between">
            <div class="flex items-center gap-2 md:gap-4">
                <a href="index.html" class="flex items-center text-ios-blue md:text-gray-500 hover:text-gray-800 text-[17px] md:text-sm md:bg-white md:p-2 md:rounded-xl md:shadow-sm">
                    <i data-lucide="chevron-left" class="w-6 h-6 md:w-5 md:h-5 md:-ml-0 -ml-2"></i>
                    <span class="md:hidden">Back</span>
                </a>
                <div class="hidden md:block">
                    <h1 class="text-2xl font-bold tracking-tight leading-none">INV-24-092</h1>
                    <p class="text-sm text-gray-500 mt-1">Editing Invoice</p>
                </div>
            </div>
            
            <h1 class="text-[17px] font-semibold md:hidden">INV-24-092</h1>
            
            <div class="flex items-center gap-2 md:gap-4">
                <button class="hidden md:block px-4 py-2 bg-white rounded-xl text-sm font-semibold text-gray-700 shadow-sm border border-gray-200 hover:bg-gray-50">Cancel</button>
                <button class="text-ios-blue text-[17px] md:text-sm md:bg-ios-blue md:text-white md:px-4 md:py-2 md:rounded-xl font-semibold md:shadow-sm hover:opacity-90">Save</button>
            </div>
        </header>

        <!-- Scrollable Form Content -->
        <main class="flex-1 overflow-y-auto pb-8 md:pb-12 px-4 md:px-8 space-y-6 md:space-y-8 pt-6 md:pt-2">
            <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8">
                
                <!-- Left Column / Main Form -->
                <div class="lg:col-span-2 space-y-6 md:space-y-8">
                    
                    <!-- Section 1: Client -->
                    <section>
                        <h2 class="text-[13px] font-medium text-ios-gray uppercase tracking-wider mb-2 md:mb-3 pl-4 md:pl-0">Client Information</h2>
                        <div class="bg-white rounded-xl overflow-hidden md:shadow-sm md:border md:border-black/5">
                            <div class="flex flex-col md:flex-row md:items-center justify-between p-4 border-b border-ios-border/50 md:border-gray-100 gap-2 md:gap-4">
                                <span class="text-[17px] md:text-sm font-medium md:text-gray-500 md:w-1/3">Customer</span>
                                <div class="flex items-center justify-between md:justify-end flex-1">
                                    <span class="text-[17px] md:text-sm font-semibold text-black">Acme Corporation</span>
                                    <i data-lucide="chevron-right" class="w-5 h-5 ml-1 text-ios-gray md:hidden"></i>
                                </div>
                            </div>
                            <div class="flex flex-col md:flex-row md:items-center justify-between p-4 gap-2 md:gap-4">
                                <span class="text-[17px] md:text-sm font-medium md:text-gray-500 md:w-1/3">Email Address</span>
                                <input type="email" value="billing@acme.corp" class="text-[17px] md:text-sm md:font-medium text-ios-blue md:text-black outline-none bg-transparent w-full md:flex-1 md:text-right">
                            </div>
                        </div>
                    </section>

                    <!-- Section 2: Dates -->
                    <section>
                        <h2 class="text-[13px] font-medium text-ios-gray uppercase tracking-wider mb-2 md:mb-3 pl-4 md:pl-0">Dates & Terms</h2>
                        <div class="bg-white rounded-xl overflow-hidden md:shadow-sm md:border md:border-black/5 md:grid md:grid-cols-2 md:divide-x md:divide-gray-100">
                            <div class="flex flex-col md:flex-row md:items-center justify-between p-4 border-b border-ios-border/50 md:border-none gap-2">
                                <span class="text-[17px] md:text-sm font-medium md:text-gray-500">Issue Date</span>
                                <input type="date" value="2024-10-24" class="text-[17px] md:text-sm md:font-mono text-ios-gray md:text-black outline-none bg-transparent">
                            </div>
                            <div class="flex flex-col md:flex-row md:items-center justify-between p-4 gap-2">
                                <span class="text-[17px] md:text-sm font-medium md:text-gray-500">Due Date</span>
                                <input type="date" value="2024-11-24" class="text-[17px] md:text-sm md:font-mono text-ios-gray md:text-black outline-none bg-transparent">
                            </div>
                        </div>
                    </section>

                    <!-- Section 3: Line Items (Adaptive) -->
                    <section>
                        <div class="flex items-center justify-between mb-2 md:mb-3 pl-4 md:pl-0 pr-2 md:pr-0">
                            <h2 class="text-[13px] font-medium text-ios-gray uppercase tracking-wider">Line Items</h2>
                            <button class="text-ios-blue text-[13px] font-medium md:bg-ios-blue/10 md:px-3 md:py-1.5 md:rounded-lg">Add Row</button>
                        </div>
                        
                        <div class="bg-white rounded-xl overflow-hidden md:shadow-sm md:border md:border-black/5 divide-y divide-ios-border/50 md:divide-gray-100">
                            <!-- Header for Desktop -->
                            <div class="hidden md:flex p-3 bg-gray-50 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                <div class="flex-1">Description</div>
                                <div class="w-24 text-center">Qty</div>
                                <div class="w-32 text-right">Price</div>
                                <div class="w-32 text-right">Total</div>
                            </div>
                            
                            <!-- Item 1 -->
                            <div class="p-4 md:flex md:items-center">
                                <div class="flex justify-between mb-2 md:mb-0 md:flex-1">
                                    <input type="text" value="Enterprise License" class="text-[17px] md:text-sm font-medium outline-none bg-transparent w-full">
                                </div>
                                <div class="flex justify-between items-center text-ios-gray md:w-[22rem]">
                                    <div class="flex items-center gap-2 md:w-24 md:justify-center">
                                        <span class="text-[15px] md:hidden">Qty:</span>
                                        <input type="number" value="1" class="w-12 border border-ios-border md:border-transparent rounded text-center px-1 py-0.5 outline-none text-[15px] md:text-sm md:font-mono md:bg-gray-50 focus:bg-white focus:border-ios-blue">
                                    </div>
                                    <div class="flex items-center gap-2 md:w-32 md:justify-end">
                                        <span class="text-[15px] md:hidden">$</span>
                                        <input type="text" value="$3,500.00" class="w-24 text-right outline-none text-[15px] md:text-sm md:font-mono md:bg-transparent">
                                    </div>
                                    <div class="hidden md:block w-32 text-right font-mono font-bold text-sm text-black">
                                        $3,500.00
                                    </div>
                                </div>
                            </div>

                            <!-- Item 2 -->
                            <div class="p-4 md:flex md:items-center">
                                <div class="flex justify-between mb-2 md:mb-0 md:flex-1">
                                    <input type="text" value="Support Hours" class="text-[17px] md:text-sm font-medium outline-none bg-transparent w-full">
                                </div>
                                <div class="flex justify-between items-center text-ios-gray md:w-[22rem]">
                                    <div class="flex items-center gap-2 md:w-24 md:justify-center">
                                        <span class="text-[15px] md:hidden">Qty:</span>
                                        <input type="number" value="5" class="w-12 border border-ios-border md:border-transparent rounded text-center px-1 py-0.5 outline-none text-[15px] md:text-sm md:font-mono md:bg-gray-50 focus:bg-white focus:border-ios-blue">
                                    </div>
                                    <div class="flex items-center gap-2 md:w-32 md:justify-end">
                                        <span class="text-[15px] md:hidden">$</span>
                                        <input type="text" value="$140.00" class="w-24 text-right outline-none text-[15px] md:text-sm md:font-mono md:bg-transparent">
                                    </div>
                                    <div class="hidden md:block w-32 text-right font-mono font-bold text-sm text-black">
                                        $700.00
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                </div>

                <!-- Right Column / Totals -->
                <div class="space-y-6 md:space-y-8">
                    <!-- Section 4: Totals -->
                    <section>
                        <h2 class="hidden lg:block text-[13px] font-medium text-ios-gray uppercase tracking-wider mb-3">Summary</h2>
                        <div class="bg-white rounded-xl overflow-hidden p-4 md:p-6 space-y-2 md:space-y-4 md:shadow-sm md:border md:border-black/5">
                            <div class="flex justify-between text-[15px] md:text-sm text-ios-gray md:text-gray-500 font-medium">
                                <span>Subtotal</span>
                                <span class="md:font-mono md:text-black">$4,200.00</span>
                            </div>
                            <div class="flex justify-between text-[15px] md:text-sm text-ios-gray md:text-gray-500 font-medium">
                                <span>Tax (0%)</span>
                                <span class="md:font-mono md:text-black">$0.00</span>
                            </div>
                            <div class="pt-2 md:pt-4 mt-2 md:mt-4 border-t border-ios-border/50 md:border-gray-200 flex justify-between text-[17px] md:text-lg font-semibold md:font-bold text-black">
                                <span>Total</span>
                                <span class="md:font-mono text-ios-blue md:text-black">$4,200.00</span>
                            </div>
                            
                            <button class="hidden lg:block w-full mt-6 bg-ios-blue text-white rounded-xl py-3 font-semibold shadow-sm hover:opacity-90 transition-opacity">
                                Post Invoice
                            </button>
                        </div>
                    </section>

                    <!-- Native destructive action (Mobile style mostly) -->
                    <section class="lg:hidden pb-8">
                        <button class="w-full bg-white rounded-xl p-4 text-center text-red-500 font-semibold text-[17px] shadow-sm">
                            Delete Invoice
                        </button>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
