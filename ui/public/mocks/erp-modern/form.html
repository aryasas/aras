<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern ERP Form - Island Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a', 950: '#042f2e',
                        },
                        surface: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617',
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.05)',
                        'floating': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f1f5f9; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 24px 24px; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.9); }
        .island { border-radius: 24px; box-shadow: var(--tw-shadow-floating); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-surface-800 antialiased h-screen flex p-4 md:p-6 gap-6 overflow-hidden">

    <!-- Floating Sidebar Island -->
    <aside class="w-20 lg:w-64 flex flex-col justify-between glass-panel island hidden md:flex transition-all duration-300 relative z-20">
        <div class="p-4 flex flex-col h-full">
            <div class="h-12 flex items-center justify-center lg:justify-start lg:px-4 mb-8">
                <div class="w-10 h-10 bg-surface-900 rounded-xl flex items-center justify-center text-white font-bold shadow-md shrink-0">
                    <i data-lucide="box" class="w-5 h-5 text-brand-400"></i>
                </div>
                <span class="font-bold text-xl tracking-tight text-surface-900 ml-3 hidden lg:block">Nexus</span>
            </div>
            <nav class="space-y-2 flex-1 hide-scroll overflow-y-auto">
                <a href="index.html" class="group flex items-center gap-3 p-3 lg:px-4 text-surface-500 hover:bg-white hover:text-surface-900 rounded-2xl font-medium hover:shadow-sm hover:border hover:border-surface-100 transition-all border border-transparent">
                    <i data-lucide="layout-grid" class="w-5 h-5 shrink-0 group-hover:text-brand-500 transition-colors"></i>
                    <span class="hidden lg:block">Dashboard</span>
                </a>
                <a href="#" class="group flex items-center gap-3 p-3 lg:px-4 bg-white text-brand-600 rounded-2xl font-semibold shadow-sm border border-surface-100 transition-all">
                    <i data-lucide="file-text" class="w-5 h-5 shrink-0"></i>
                    <span class="hidden lg:block">Invoice Form</span>
                </a>
            </nav>
            <div class="mt-4 pt-4 border-t border-surface-200/50">
                <div class="flex items-center gap-3 p-2 bg-surface-100/50 rounded-2xl border border-surface-200/50 cursor-pointer hover:bg-white transition-colors">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=1e293b&color=fff&bold=true" alt="User" class="w-10 h-10 rounded-xl shrink-0 object-cover">
                    <div class="flex-col hidden lg:flex">
                        <span class="text-sm font-bold text-surface-900 leading-tight">A. Aras</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 h-full gap-6">
        
        <!-- Floating Header -->
        <header class="h-20 glass-panel island shrink-0 flex items-center justify-between px-6 z-10">
            <div class="flex items-center gap-4">
                <a href="index.html" class="p-2 text-surface-500 hover:text-surface-900 bg-white rounded-xl border border-surface-200 shadow-sm transition-all flex items-center justify-center">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <button class="flex items-center gap-2 bg-brand-500 hover:bg-brand-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-md hover:shadow-lg border border-brand-600">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    Save Record
                </button>
                <div>
                    <h1 class="text-xl font-bold text-surface-900 leading-none">Invoice <span class="font-mono text-brand-600">#INV-24-092</span></h1>
                    <p class="text-xs text-surface-500 font-medium mt-1">Editing Record</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button class="px-5 py-2.5 bg-white text-surface-700 rounded-xl text-sm font-bold transition-all shadow-sm border border-surface-200 hover:bg-surface-50 hidden sm:block">Cancel</button>
            </div>
        </header>

        <!-- Scrollable Form Content -->
        <div class="flex-1 overflow-y-auto hide-scroll pb-6">
            <div class="max-w-5xl mx-auto space-y-6">
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Left Column / Main Form -->
                    <div class="lg:col-span-2 space-y-6">
                        <!-- Primary Details Island -->
                        <div class="glass-panel island p-6">
                            <h3 class="text-lg font-bold text-surface-900 mb-4 border-b border-surface-200/50 pb-2">Client Details</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-surface-500 uppercase tracking-wider mb-1.5">Customer Name</label>
                                    <div class="relative">
                                        <select class="w-full pl-4 pr-10 py-3 bg-surface-50 border border-surface-200 rounded-xl text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-brand-500/20 outline-none appearance-none cursor-pointer">
                                            <option>Acme Corporation</option>
                                            <option>Global Tech</option>
                                        </select>
                                        <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-surface-400 pointer-events-none"></i>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-surface-500 uppercase tracking-wider mb-1.5">Contact Email</label>
                                    <input type="email" value="billing@acme.corp" class="w-full px-4 py-3 bg-surface-50 border border-surface-200 rounded-xl text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-brand-500/20 outline-none">
                                </div>
                            </div>
                        </div>

                        <!-- Secondary Details Island -->
                        <div class="glass-panel island p-6">
                            <h3 class="text-lg font-bold text-surface-900 mb-4 border-b border-surface-200/50 pb-2">Billing Information</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-surface-500 uppercase tracking-wider mb-1.5">Issue Date</label>
                                    <input type="date" value="2024-10-24" class="w-full px-4 py-3 bg-surface-50 border border-surface-200 rounded-xl text-sm font-mono font-semibold focus:bg-white focus:ring-2 focus:ring-brand-500/20 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-surface-500 uppercase tracking-wider mb-1.5">Due Date</label>
                                    <input type="date" value="2024-11-24" class="w-full px-4 py-3 bg-surface-50 border border-surface-200 rounded-xl text-sm font-mono font-semibold focus:bg-white focus:ring-2 focus:ring-brand-500/20 outline-none">
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="block text-xs font-bold text-surface-500 uppercase tracking-wider mb-1.5">Billing Address</label>
                                    <textarea rows="2" class="w-full px-4 py-3 bg-surface-50 border border-surface-200 rounded-xl text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-brand-500/20 outline-none">123 Innovation Drive&#10;San Francisco, CA 94105</textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Line Items Island -->
                        <div class="glass-panel island overflow-hidden">
                            <div class="p-6 border-b border-surface-200/50 flex justify-between items-center bg-white/40">
                                <h3 class="text-lg font-bold text-surface-900">Line Items</h3>
                                <button class="text-sm font-bold text-brand-600 hover:text-brand-700 flex items-center"><i data-lucide="plus" class="w-4 h-4 mr-1"></i> Add Row</button>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-surface-50/50 text-xs font-bold text-surface-400 uppercase tracking-wider border-b border-surface-200/50">
                                        <tr>
                                            <th class="px-6 py-3">Description</th>
                                            <th class="px-4 py-3 w-24">Qty</th>
                                            <th class="px-4 py-3 w-32">Price</th>
                                            <th class="px-6 py-3 w-32 text-right">Total</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-surface-100/50 bg-white/20">
                                        <tr>
                                            <td class="px-6 py-3">
                                                <input type="text" value="Enterprise Software License" class="w-full px-3 py-2 bg-transparent border border-transparent hover:border-surface-200 rounded-lg text-sm font-semibold outline-none focus:bg-white focus:border-brand-300">
                                            </td>
                                            <td class="px-4 py-3">
                                                <input type="number" value="1" class="w-full px-3 py-2 bg-transparent border border-transparent hover:border-surface-200 rounded-lg text-sm font-mono font-semibold outline-none focus:bg-white focus:border-brand-300">
                                            </td>
                                            <td class="px-4 py-3">
                                                <input type="text" value="$3,500.00" class="w-full px-3 py-2 bg-transparent border border-transparent hover:border-surface-200 rounded-lg text-sm font-mono font-semibold outline-none focus:bg-white focus:border-brand-300">
                                            </td>
                                            <td class="px-6 py-3 text-right font-mono font-bold text-surface-900">$3,500.00</td>
                                        </tr>
                                        <tr>
                                            <td class="px-6 py-3">
                                                <input type="text" value="Implementation Support (Hours)" class="w-full px-3 py-2 bg-transparent border border-transparent hover:border-surface-200 rounded-lg text-sm font-semibold outline-none focus:bg-white focus:border-brand-300">
                                            </td>
                                            <td class="px-4 py-3">
                                                <input type="number" value="5" class="w-full px-3 py-2 bg-transparent border border-transparent hover:border-surface-200 rounded-lg text-sm font-mono font-semibold outline-none focus:bg-white focus:border-brand-300">
                                            </td>
                                            <td class="px-4 py-3">
                                                <input type="text" value="$140.00" class="w-full px-3 py-2 bg-transparent border border-transparent hover:border-surface-200 rounded-lg text-sm font-mono font-semibold outline-none focus:bg-white focus:border-brand-300">
                                            </td>
                                            <td class="px-6 py-3 text-right font-mono font-bold text-surface-900">$700.00</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column / Totals & Meta -->
                    <div class="space-y-6">
                        <!-- Summary Island -->
                        <div class="glass-panel island p-6 bg-surface-900 text-white relative overflow-hidden">
                            <div class="absolute -right-10 -top-10 w-32 h-32 bg-brand-500 rounded-full mix-blend-screen filter blur-2xl opacity-30"></div>
                            
                            <h3 class="text-lg font-bold mb-4 relative z-10">Financial Summary</h3>
                            
                            <div class="space-y-3 mb-6 relative z-10 text-sm font-medium text-surface-300">
                                <div class="flex justify-between">
                                    <span>Subtotal</span>
                                    <span class="font-mono text-white">$4,200.00</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>Tax (0%)</span>
                                    <span class="font-mono text-white">$0.00</span>
                                </div>
                                <div class="flex justify-between pt-3 border-t border-white/10 text-base text-white">
                                    <span class="font-bold">Total Amount</span>
                                    <span class="font-mono font-bold text-brand-300">$4,200.00</span>
                                </div>
                            </div>

                            <button class="w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-3 rounded-xl transition-colors relative z-10">Post Invoice</button>
                        </div>

                        <!-- Status Island -->
                        <div class="glass-panel island p-6">
                            <h3 class="text-sm font-bold text-surface-400 uppercase tracking-wider mb-4">Record Status</h3>
                            <div class="flex items-center gap-3 p-3 bg-emerald-50 border border-emerald-100 rounded-xl">
                                <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
                                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-emerald-800">Draft Saved</p>
                                    <p class="text-xs text-emerald-600 font-medium">Just now</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
