<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- gpt-5.4 -->
    <!-- CSP note: backend script-src pins the sha256 for this exact inline bootstrap in security_headers.py. Update both together if this script changes. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('aras-ui-prefs') || '{}')
        var state = s.state || s
        var mode = state.themeMode === 'dark' ? 'dark' : 'light'
        if (mode === 'dark') { document.documentElement.classList.add('dark') }
        document.documentElement.setAttribute('data-theme', mode)
      } catch(e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFAF7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aras" />
    <title>Aras</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
