<!-- sidebar menu area start -->
<div class="sidebar-menu" id="sidebar-menu">

  <div class="sidebar-header" style="position:relative;">
    <div class="logo">
      <a href="{{ url_for('admin.dashboard') }}" style="font-family: Avenir Black;font-size: 300%; color: white;">aras</a>
    </div>
    <button id="sidebar-close-btn" onclick="document.body.classList.toggle('sbar_collapsed')"
            title="Hide sidebar"
            style="position:absolute;top:50%;right:16px;transform:translateY(-50%);
                   background:rgba(255,255,255,.1);border:none;border-radius:4px;
                   color:rgba(255,255,255,.7);width:28px;height:28px;
                   display:flex;align-items:center;justify-content:center;
                   cursor:pointer;font-size:14px;line-height:1;padding:0;">
      <i class="fa fa-times"></i>
    </button>
  </div>

  <nav id="sidebar-nav" style="padding:8px 0;overflow-y:auto;flex:1;">
    <ul class="sidebar-menu-list">

      <!-- Dashboard -->
      <li class="sidebar-item">
        <a href="{{ url_for('admin.dashboard') }}" class="sidebar-link">
          <i class="ti-home sidebar-icon"></i>
          <span class="sidebar-label">Dashboard</span>
        </a>
      </li>

      {% if g.gmenu %}
        {% for app in g.gmenu %}
        <li class="sidebar-item">
          <a href="{{ app.url or '#' }}" class="sidebar-link sidebar-app-link">
            <i class="fa {{ app.icon or 'fa-cubes' }} sidebar-icon"></i>
            <span class="sidebar-label">{{ app.title }}</span>
          </a>
        </li>
        {% endfor %}
      {% endif %}

      <!-- Divider -->
      <li class="sidebar-divider"></li>

      <!-- Settings -->
      <li class="sidebar-item">
        <a href="{{ url_for('admin.settings') }}" class="sidebar-link">
          <i class="ti-settings sidebar-icon"></i>
          <span class="sidebar-label">Settings</span>
        </a>
      </li>

    </ul>
  </nav>

</div>
<!-- sidebar menu area end -->

<style>
.sidebar-menu-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.sidebar-item {
  display: block;
  width: 100%;
}
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  color: rgba(255,255,255,.75);
  text-decoration: none;
  font-size: 13px;
  white-space: nowrap;
  transition: background .15s, color .15s;
  cursor: pointer;
  position: relative;
}
.sidebar-link:hover {
  background: rgba(255,255,255,.08);
  color: #fff;
  text-decoration: none;
}
.sidebar-app-link {
  color: rgba(255,255,255,.9);
  font-weight: 500;
}
.sidebar-icon {
  font-size: 14px;
  width: 16px;
  text-align: center;
  flex-shrink: 0;
}
.sidebar-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-divider {
  display: block;
  margin: 8px 20px;
  border-top: 1px solid rgba(255,255,255,.1);
}
/* Active state: highlight current page */
.sidebar-link.active {
  background: rgba(255,255,255,.12);
  color: #fff;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var path = window.location.pathname;
  document.querySelectorAll('#sidebar-nav .sidebar-link').forEach(function (link) {
    var href = link.getAttribute('href');
    if (href && href !== '#' && path.startsWith(href) && href.length > 1) {
      link.classList.add('active');
    }
  });
});
</script>
