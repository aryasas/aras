# ERP RBAC seed — loaded by `manage.py seed` or ErpApp.seed().
# Actions: READ | CREATE | UPDATE | DELETE
# Resources match ERP model __tablename__ values.

roles:

  - name: "ERP Admin"
    description: "Full access to all ERP resources"
    permissions:
      # Accounting
      - resource: erp_accounting_accounts
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_accounting_fiscal_periods
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_accounting_entries
        actions: [READ, CREATE, UPDATE, DELETE]
