        actions: [READ]
      - resource: erp_crm_leads
        actions: [READ, CREATE, UPDATE]
      - resource: erp_crm_activities
        actions: [READ, CREATE, UPDATE]
      # Parties
      - resource: erp_party_parties
        actions: [READ, CREATE, UPDATE]
