        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_stock_item_accounts
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_stock_item_uoms
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_stock_pricelists
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_stock_promo_bundles
        actions: [READ, CREATE, UPDATE, DELETE]
