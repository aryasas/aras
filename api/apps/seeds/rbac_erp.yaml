        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_stock_item_locations
        actions: [READ, CREATE, UPDATE, DELETE]
      # Config
      - resource: erp_config_organizations
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_config_currencies
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_config_uoms
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_config_price_types
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_config_charges
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_config_exchange_rates
        actions: [READ, CREATE, UPDATE, DELETE]
      - resource: erp_config_settings
