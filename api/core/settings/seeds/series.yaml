# Naming series for all ERP document types.
# key must match the model's __tablename__.
# format tokens: {prefix}, {year}, {next_value}
series:
  - key: accounting_entries
    prefix: "JE-"
    format: "{prefix}{year}-{next_value:04d}"
    config:
      reset_yearly: true

  - key: accounting_inflow_invoices
    prefix: "INV-"
    format: "{prefix}{year}-{next_value:04d}"
    config:
      reset_yearly: true

  - key: accounting_outflow_invoices
    prefix: "BILL-"
    format: "{prefix}{year}-{next_value:04d}"
    config:
      reset_yearly: true

  - key: accounting_payments
    prefix: "PAY-"
    format: "{prefix}{year}-{next_value:04d}"
    config:
      reset_yearly: true

  - key: accounting_grns
    prefix: "GRN-"
    format: "{prefix}{year}-{next_value:04d}"
    config:
      reset_yearly: true

  - key: stock_movements
    prefix: "MV-"
    format: "{prefix}{year}-{next_value:04d}"
    config:
      reset_yearly: true

  - key: stock_delivery_notes
    prefix: "DN-"
    format: "{prefix}{year}-{next_value:04d}"
    config:
      reset_yearly: true

  - key: pot_sessions
    prefix: "SES-"
    format: "{prefix}{year}-{next_value:04d}"
    config:
      reset_yearly: true

  - key: pot_orders
    prefix: "ORD-"
    format: "{prefix}{year}-{next_value:04d}"
    config:
      reset_yearly: true

  - key: party_parties
    prefix: "PARTY-"
    format: "{prefix}{next_value:05d}"
    config: {}
