version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: aras_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-arasdb}
      MYSQL_USER: ${DB_USER:-aras}
      MYSQL_PASSWORD: ${DB_PASSWORD:-araspass}
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: aras_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Use the service name 'db' as the host
      SQLALCHEMY_DATABASE_URI: mysql+mariadb://aras:araspass@db:3306/arasdb
      FLASK_RUN_PORT: 8080
      SECRET_KEY: ${SECRET_KEY:-your_secret_key_here}
      # Set FLASK_ENV to development for debug toolbar and other dev features
      FLASK_ENV: development
    depends_on:
      - db
    volumes:
      - .:/app # Mount the current directory into the container for live updates (optional but useful for dev)
    command: sh -c "python wait_for_db.py && flask aras dbca && flask aras erp-init && python run.py"

volumes:
  db_data:
