<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@icon/themify-icons/themify-icons.css">
<style>
  body { padding: 0; background: #f8f9fa; }
  .frame { display: flex; align-items: stretch; min-height: 360px; }
  .sb { width: 220px; background: #1f2a44; color: #fff; }
  .brand { padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,.08); position: relative; }
  .mark { font-family: "Libre Baskerville", "Iowan Old Style", Georgia, serif; font-weight: 700; font-size: 40px; color: #fff; letter-spacing: -0.025em; line-height: 1; }
  .close { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.1); border: 0; color: rgba(255,255,255,.7); width: 26px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  nav ul { list-style: none; margin: 0; padding: 12px 0; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 10px 24px; color: rgba(255,255,255,.85); text-decoration: none; font-size: 13px; }
  nav a.active, nav a:hover { background: #141b2d; color: #fff; }
  nav a.muted { color: rgba(255,255,255,.75); }
  nav a i { width: 16px; text-align: center; font-size: 14px; }
  .div { margin: 8px 24px; border-top: 1px solid rgba(255,255,255,.1); }
  .pane { flex: 1; padding: 24px; }
</style>
<div class="frame">
  <aside class="sb">
    <div class="brand">
      <div class="mark">aras</div>
      <button class="close"><i class="fa fa-times"></i></button>
    </div>
    <nav>
      <ul>
        <li><a class="active" href="#"><i class="ti-home"></i>Dashboard</a></li>
        <li><a href="#"><i class="fa fa-users"></i>Users</a></li>
        <li><a href="#"><i class="ti-layout-grid2"></i>App Builder</a></li>
        <li><a href="#"><i class="ti-server"></i>Database</a></li>
        <li><a class="muted" href="#"><i class="fa fa-file-text-o"></i>Notes</a></li>
        <li><div class="div"></div></li>
        <li><a class="muted" href="#"><i class="ti-settings"></i>Settings</a></li>
      </ul>
    </nav>
  </aside>
  <div class="pane"><span class="muted">Content area — the dark sidebar is the one brand-colored surface.</span></div>
</div>
