<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { background: #f8f9fa; padding: 32px; }
  .shelf { display: flex; gap: 24px; }
  .tile { background: #fff; width: 180px; height: 80px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #313b3d; font-weight: 500; font-size: 12px; }
  .lbl { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; color: #6c757d; margin-top: 8px; }
</style>
<div class="shelf">
  <div><div class="tile" style="border: 1px solid #eef0f2">no shadow · hairline</div><div class="lbl">cards, rows (default)</div></div>
  <div><div class="tile" style="box-shadow: 0 1px 2px rgba(20,27,45,.06)">shadow-sm</div><div class="lbl">0 1 2 · rgba(20,27,45,.06)</div></div>
  <div><div class="tile" style="box-shadow: 0 2px 6px rgba(20,27,45,.08)">shadow</div><div class="lbl">0 2 6 · rgba(20,27,45,.08)</div></div>
  <div><div class="tile" style="box-shadow: 0 4px 12px rgba(0,0,0,.10)">shadow-drop</div><div class="lbl">dropdowns, popovers</div></div>
</div>
