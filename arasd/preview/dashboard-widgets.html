<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
<style>
  body {
    background: #f4f6f8; padding: 28px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-variation-settings: "opsz" 14;
    color: #0f1b2d;
  }

  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

  /* Stat card — no gradient, no colored border, no ghost icon.
     Hierarchy is: tiny caps label → big serif number → trend line → link. */
  .w {
    background: #fff;
    border-radius: 4px;
    padding: 20px 22px 18px;
    box-shadow: 0 1px 2px rgba(15,27,45,.04), 0 0 0 1px rgba(15,27,45,.04);
    display: flex; flex-direction: column; gap: 10px;
    min-height: 148px;
  }

  .cap {
    font: 500 9.5px/1 SFMono-Regular, Menlo, Consolas, monospace;
    text-transform: uppercase; letter-spacing: 1.4px;
    color: #9aacb8;
  }

  .figrow { display: flex; align-items: baseline; gap: 10px; }
  .val {
    font-family: "Libre Baskerville", Georgia, serif;
    font-weight: 700;
    font-size: 38px;
    line-height: 1;
    color: #0f1b2d;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .delta {
    font: 500 11.5px "Bricolage Grotesque", sans-serif;
    font-variation-settings: "opsz" 12;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .delta.up   { color: #4f6f53; }
  .delta.down { color: #8a4a4a; }
  .delta.flat { color: #9aacb8; }

  .trend { height: 36px; margin: 2px 0; }
  .trend path.line { fill: none; stroke-width: 1.5; }
  .trend path.area { stroke: none; opacity: .22; }

  .rule { border: 0; border-top: 1px solid #eef0f2; margin: 2px 0 0; }

  .foot {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 6px;
  }
  .lnk {
    font: 500 11.5px "Bricolage Grotesque", sans-serif;
    color: #2d4a6b;
    letter-spacing: -0.005em;
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .lnk:hover { color: #0f1b2d; }
  .lnk::after {
    content: "→";
    font-family: "Libre Baskerville", serif;
    transition: transform .2s ease;
  }
  .lnk:hover::after { transform: translateX(2px); }

  .note {
    font-family: "Libre Baskerville", Georgia, serif;
    font-style: italic;
    font-size: 11px;
    color: #9aacb8;
  }
</style>

<div class="grid4">

  <!-- 1: Total Users -->
  <div class="w">
    <span class="cap">Total Users</span>
    <div class="figrow">
      <span class="val">128</span>
      <span class="delta up">▲ 6</span>
    </div>
    <svg class="trend" viewBox="0 0 120 36" preserveAspectRatio="none">
      <path class="area" fill="#2d4a6b" d="M0,28 L12,24 24,22 36,18 48,20 60,14 72,17 84,11 96,12 108,8 120,10 L120,36 L0,36 Z"/>
      <path class="line" stroke="#2d4a6b" d="M0,28 L12,24 24,22 36,18 48,20 60,14 72,17 84,11 96,12 108,8 120,10"/>
    </svg>
    <hr class="rule">
    <div class="foot">
      <span class="note">vs. last 30 days</span>
      <a class="lnk">View all</a>
    </div>
  </div>

  <!-- 2: Active Apps -->
  <div class="w">
    <span class="cap">Active Apps</span>
    <div class="figrow">
      <span class="val">7</span>
      <span class="delta up">▲ 1</span>
    </div>
    <svg class="trend" viewBox="0 0 120 36" preserveAspectRatio="none">
      <path class="area" fill="#6b8e6f" d="M0,30 L15,28 30,26 45,22 60,22 75,18 90,18 105,15 120,14 L120,36 L0,36 Z"/>
      <path class="line" stroke="#6b8e6f" d="M0,30 L15,28 30,26 45,22 60,22 75,18 90,18 105,15 120,14"/>
    </svg>
    <hr class="rule">
    <div class="foot">
      <span class="note">one new this week</span>
      <a class="lnk">App builder</a>
    </div>
  </div>

  <!-- 3: Tables -->
  <div class="w">
    <span class="cap">Tables</span>
    <div class="figrow">
      <span class="val">32</span>
      <span class="delta flat">— 0</span>
    </div>
    <svg class="trend" viewBox="0 0 120 36" preserveAspectRatio="none">
      <path class="area" fill="#6e849a" d="M0,20 L15,18 30,21 45,19 60,18 75,20 90,19 105,20 120,18 L120,36 L0,36 Z"/>
      <path class="line" stroke="#6e849a" d="M0,20 L15,18 30,21 45,19 60,18 75,20 90,19 105,20 120,18"/>
    </svg>
    <hr class="rule">
    <div class="foot">
      <span class="note">holding steady</span>
      <a class="lnk">Database</a>
    </div>
  </div>

  <!-- 4: Pending -->
  <div class="w">
    <span class="cap">Pending</span>
    <div class="figrow">
      <span class="val">4</span>
      <span class="delta down">▼ 2</span>
    </div>
    <svg class="trend" viewBox="0 0 120 36" preserveAspectRatio="none">
      <path class="area" fill="#b08968" d="M0,8 L15,12 30,10 45,14 60,16 75,13 90,18 105,21 120,22 L120,36 L0,36 Z"/>
      <path class="line" stroke="#b08968" d="M0,8 L15,12 30,10 45,14 60,16 75,13 90,18 105,21 120,22"/>
    </svg>
    <hr class="rule">
    <div class="foot">
      <span class="note">down from 6</span>
      <a class="lnk">Activities</a>
    </div>
  </div>

</div>
