<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@icon/themify-icons/themify-icons.css">
<style>
  body {
    padding: 28px 32px; background: #fff;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, sans-serif;
    color: #0f1b2d;
  }

  /* Eyebrow */
  .eyebrow { display: flex; align-items: baseline; gap: 12px; margin: 0 0 18px; }
  .eyebrow:not(:first-child) { margin-top: 24px; }
  .eyebrow .caps {
    font: 600 9.5px/1.2 SFMono-Regular, Menlo, Consolas, monospace;
    text-transform: uppercase; letter-spacing: 1.4px; color: #9aacb8;
  }
  .eyebrow .dot { flex: 1; height: 1px; background: #eef0f2; align-self: center; }
  .eyebrow .serif { font-family: "Libre Baskerville", Georgia, serif; font-size: 11px; color: #9aacb8; }

  /* Form grid */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 28px; }

  /* Underline input — the new default */
  .fld { display: flex; flex-direction: column; gap: 4px; position: relative; }
  .fld label {
    font-family: "Libre Baskerville", Georgia, serif;
    font-weight: 400;
    font-size: 11.5px;
    color: #6c757d;
    letter-spacing: .1px;
  }
  .fld .ctrl {
    position: relative;
    border-bottom: 1px solid #dde3e7;
    transition: border-color .18s ease;
  }
  .fld .ctrl input {
    width: 100%; height: 36px;
    padding: 6px 0 6px 22px;
    border: 0; background: transparent;
    font: 500 15px/1 "Inter Tight", sans-serif;
    color: #0f1b2d; letter-spacing: -.005em;
    box-sizing: border-box;
  }
  .fld .ctrl input::placeholder { color: #b4bcc4; font-weight: 400; }
  .fld .ctrl input:focus { outline: none; }
  .fld .ctrl i {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    color: #9aacb8; font-size: 13px;
  }
  /* Focus — slate underline + subtle slate tint for the icon */
  .fld .ctrl:focus-within { border-bottom-color: #2d4a6b; border-bottom-width: 1.5px; }
  .fld .ctrl:focus-within i { color: #2d4a6b; }

  /* Error — clay red, whisper-quiet */
  .fld.err .ctrl { border-bottom-color: #a05a5a; border-bottom-width: 1.5px; }
  .fld.err .ctrl i { color: #a05a5a; }
  .fld.err .hint { color: #8a4a4a; }

  /* Assistive text — serif italic, small */
  .hint {
    font-family: "Libre Baskerville", Georgia, serif;
    font-style: italic;
    font-size: 11px;
    color: #9aacb8;
    margin-top: 4px;
  }

  /* Select variant */
  .select {
    position: relative;
  }
  .select select {
    appearance: none; -webkit-appearance: none;
    width: 100%; height: 36px;
    padding: 6px 24px 6px 22px;
    border: 0; background: transparent;
    font: 500 15px/1 "Inter Tight", sans-serif;
    color: #0f1b2d; letter-spacing: -.005em;
  }
  .select .chev {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    color: #9aacb8; font-size: 10px;
  }

  /* Toggle row at the bottom */
  .toggles {
    display: flex; align-items: center; gap: 20px;
    padding-top: 14px; border-top: 1px solid #eef0f2;
  }
  .toggles label {
    display: inline-flex; align-items: center; gap: 8px;
    font: 400 13px "Inter Tight", sans-serif; color: #0f1b2d; cursor: pointer;
  }
  .toggles input[type="checkbox"] {
    appearance: none; width: 14px; height: 14px;
    border: 1px solid #c9d2d9; border-radius: 2px; background: #fff;
    position: relative; cursor: pointer;
  }
  .toggles input[type="checkbox"]:checked {
    background: #2d4a6b; border-color: #2d4a6b;
  }
  .toggles input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 3px; top: 0px;
    width: 4px; height: 8px; border: solid #fff;
    border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
  }
</style>

<div class="eyebrow">
  <span class="caps">Form</span>
  <span class="dot"></span>
  <span class="serif">Underline — quiet, editorial</span>
</div>

<div class="grid2">
  <div class="fld">
    <label>Email or username</label>
    <div class="ctrl"><i class="ti-email"></i><input placeholder="name@company.com" value="ayu.hapsari@aras.co"></div>
  </div>
  <div class="fld">
    <label>Password</label>
    <div class="ctrl"><i class="ti-lock"></i><input type="password" value="••••••••"></div>
  </div>
  <div class="fld">
    <label>Workspace</label>
    <div class="ctrl select"><i class="ti-world"></i><select><option>Aras · Production</option><option>Aras · Staging</option></select><span class="chev">▾</span></div>
  </div>
  <div class="fld err">
    <label>Billing email</label>
    <div class="ctrl"><i class="ti-email"></i><input value="invalid-email"></div>
    <div class="hint">Email doesn't look right — missing “@”.</div>
  </div>
</div>

<div class="toggles" style="margin-top: 26px">
  <label><input type="checkbox" checked> Remember me</label>
  <label><input type="checkbox"> Subscribe to product notes</label>
</div>
