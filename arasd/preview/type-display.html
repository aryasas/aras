<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px 32px; background: #fff; }
  .spec { display: flex; gap: 14px; align-items: stretch; }
  .tile { flex: 1; border-radius: 3px; padding: 26px 28px; position: relative; }
  .dark  { background: #0f1b2d; color: #fff; }
  .light { background: #f4f6f8; color: #0f1b2d; }
  .mark {
    font-family: "Libre Baskerville", "Iowan Old Style", Georgia, serif;
    font-weight: 700;
    font-style: normal;
    font-size: 76px;
    line-height: 1;
    letter-spacing: -0.025em;
  }
  .meta {
    font: 10.5px SFMono-Regular, Menlo, Consolas, monospace;
    opacity: .55;
    margin-top: 14px;
    letter-spacing: .2px;
  }

  .eyebrow {
    display: flex; align-items: center; gap: 12px; margin-bottom: 22px;
  }
  .eyebrow .caps {
    font: 600 9.5px/1.2 SFMono-Regular, Menlo, Consolas, monospace;
    text-transform: uppercase; letter-spacing: 1.4px; color: #9aacb8;
  }
  .eyebrow .dot { flex: 1; height: 1px; background: #eef0f2; }
  .eyebrow .serif {
    font-family: "Libre Baskerville", Georgia, serif;
    font-size: 11px; color: #9aacb8;
  }
</style>

<div class="eyebrow">
  <span class="caps">Wordmark</span>
  <span class="dot"></span>
  <span class="serif">Libre Baskerville · upright</span>
</div>

<div class="spec">
  <div class="tile dark">
    <div class="mark">aras</div>
    <div class="meta">Libre Baskerville · 700 · 76px · white on midnight</div>
  </div>
  <div class="tile light">
    <div class="mark">aras</div>
    <div class="meta">Libre Baskerville · 700 · 76px · ink on soft</div>
  </div>
</div>
