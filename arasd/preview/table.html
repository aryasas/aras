<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
  body {
    background: #f4f6f8; padding: 28px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-variation-settings: "opsz" 14;
    color: #0f1b2d;
  }

  /* Card shell */
  .sheet {
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(15,27,45,.04), 0 0 0 1px rgba(15,27,45,.04);
    overflow: hidden;
  }

  /* Toolbar header */
  .tb {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 18px 22px 12px;
  }
  .tb h4 {
    font-family: "Libre Baskerville", Georgia, serif;
    font-weight: 700; font-size: 17px; margin: 0;
    letter-spacing: -0.01em; color: #0f1b2d;
  }
  .tb .meta {
    font-family: "Libre Baskerville", Georgia, serif;
    font-style: italic; font-size: 11.5px; color: #9aacb8;
    margin-left: 10px;
  }

  /* Table */
  table {
    width: 100%; border-collapse: collapse;
    font: 400 13px "Bricolage Grotesque", sans-serif;
    font-variation-settings: "opsz" 12;
  }
  thead th {
    font: 500 9.5px/1.2 SFMono-Regular, Menlo, Consolas, monospace;
    text-transform: uppercase; letter-spacing: 1.4px;
    color: #9aacb8;
    padding: 12px 22px;
    text-align: left; font-weight: 600;
    border-bottom: 1px solid #eef0f2;
    background: #fff;
  }
  thead th.num { text-align: right; }
  tbody td {
    padding: 14px 22px;
    color: #0f1b2d;
    vertical-align: middle;
    border-bottom: 1px solid #f4f6f8;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #fbfcfd; }

  td .hash {
    font-family: "Libre Baskerville", Georgia, serif;
    font-style: italic; font-size: 12px; color: #9aacb8;
  }
  td .name {
    font-weight: 500; letter-spacing: -0.005em;
  }
  td .url {
    font-family: SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px; color: #6c757d;
  }
  td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: #6c757d;
  }

  /* Marker status — dot + caps, the new direction */
  .mk {
    display: inline-flex; align-items: center; gap: 7px;
    font: 600 9.5px/1 SFMono-Regular, Menlo, Consolas, monospace;
    text-transform: uppercase; letter-spacing: 1.1px;
  }
  .mk .dot {
    width: 7px; height: 7px; border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(15,27,45,.08);
  }
  .mk.on  { color: #4f6f53; } .mk.on .dot { background: #6b8e6f; }
  .mk.off { color: #9aacb8; } .mk.off .dot { background: #c3cbd1; }

  /* Row actions — ghost icon buttons */
  .act { text-align: right; white-space: nowrap; }
  .act a {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px;
    color: #9aacb8;
    border-radius: 3px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .act a:hover { background: #f4f6f8; color: #0f1b2d; }
  .act a.danger:hover { background: #f4eaea; color: #8a4a4a; }

  /* Footer */
  .ft {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 22px;
    border-top: 1px solid #eef0f2;
    font: 400 11.5px "Bricolage Grotesque", sans-serif;
    color: #9aacb8;
  }
  .ft .pager a {
    padding: 4px 10px;
    color: #6c757d;
    cursor: pointer; border-radius: 3px;
  }
  .ft .pager a.on { background: #eef2f7; color: #2d4a6b; font-weight: 500; }
  .ft .pager a:hover:not(.on) { background: #f4f6f8; }
</style>

<div class="sheet">
  <div class="tb">
    <div>
      <span style="font-family: 'Libre Baskerville', Georgia, serif; font-weight: 700; font-size: 17px;">Applications</span>
      <span class="meta">3 apps, 10 tables</span>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:40px">№</th>
        <th>Name</th>
        <th>URL</th>
        <th class="num">Tables</th>
        <th>Status</th>
        <th style="width:120px;text-align:right">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><span class="hash">01</span></td>
        <td><span class="name">Human Resources</span></td>
        <td><span class="url">/hr</span></td>
        <td class="num">3</td>
        <td><span class="mk on"><span class="dot"></span>Active</span></td>
        <td class="act">
          <a title="Columns"><i class="fa fa-columns"></i></a>
          <a title="Edit"><i class="fa fa-pencil"></i></a>
          <a class="danger" title="Delete"><i class="fa fa-trash-o"></i></a>
        </td>
      </tr>
      <tr>
        <td><span class="hash">02</span></td>
        <td><span class="name">Inventory</span></td>
        <td><span class="url">/inv</span></td>
        <td class="num">5</td>
        <td><span class="mk on"><span class="dot"></span>Active</span></td>
        <td class="act">
          <a title="Columns"><i class="fa fa-columns"></i></a>
          <a title="Edit"><i class="fa fa-pencil"></i></a>
          <a class="danger" title="Delete"><i class="fa fa-trash-o"></i></a>
        </td>
      </tr>
      <tr>
        <td><span class="hash">03</span></td>
        <td><span class="name">Sales Pipeline</span></td>
        <td><span class="url">/sales</span></td>
        <td class="num">2</td>
        <td><span class="mk off"><span class="dot"></span>Draft</span></td>
        <td class="act">
          <a title="Columns"><i class="fa fa-columns"></i></a>
          <a title="Edit"><i class="fa fa-pencil"></i></a>
          <a class="danger" title="Delete"><i class="fa fa-trash-o"></i></a>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="ft">
    <span>Showing 1–3 of 3</span>
    <div class="pager">
      <a>←</a>
      <a class="on">1</a>
      <a>→</a>
    </div>
  </div>
</div>
