<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@icon/themify-icons/themify-icons.css">
<style>
  body { padding: 0; background: #f8f9fa; }
  .bar { background: #fff; border-bottom: 1px solid #eef0f2; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  .left { display: flex; align-items: center; gap: 10px; }
  .iconbtn { background: none; border: none; color: #6c757d; font-size: 16px; padding: 4px 6px; }
  .navbtn { background: #f4f6f8; border: 1px solid #dde3e7; border-radius: 4px; color: #6c757d; padding: 4px 8px; font-size: 12px; }
  .title { line-height: 1.2; }
  .title .t { font-size: 15px; font-weight: 600; color: #313b3d; }
  .title .c { font-size: 12px; color: #9aacb8; }
  .right { display: flex; align-items: center; gap: 12px; }
  .right .i { color: #6c757d; font-size: 16px; position: relative; padding: 4px; }
  .right .i .dot { position: absolute; top: -2px; right: -2px; background: #dc3545; color: #fff; font-size: 9px; padding: 0 4px; border-radius: 8px; }
  .user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #313b3d; }
  .user .a { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #5a6fd6, #1f2a44); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; }
  .menubar { background: #fff; border-bottom: 1px solid #eef0f2; padding: 0 24px; display: flex; align-items: center; gap: 2px; min-height: 36px; }
  .menubar a { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; font-size: 12px; color: #313b3d; text-decoration: none; border-radius: 3px; font-weight: 500; }
  .menubar a.home { color: #6c757d; }
  .sep { color: #dde3e7; }
</style>
<div class="bar">
  <div class="left">
    <button class="iconbtn"><i class="ti-menu"></i></button>
    <button class="navbtn"><i class="fa fa-chevron-left"></i></button>
    <button class="navbtn"><i class="fa fa-chevron-right"></i></button>
    <div class="title"><div class="t">All Users</div><div class="c"><a style="color:inherit">Home</a> / Users</div></div>
  </div>
  <div class="right">
    <span class="i"><i class="ti-fullscreen"></i></span>
    <span class="i"><i class="ti-bell"></i><span class="dot">3</span></span>
    <span class="i"><i class="fa fa-envelope-o"></i></span>
    <span class="i"><i class="ti-settings"></i></span>
    <div class="user"><div class="a">JD</div><span>jdoe</span></div>
  </div>
</div>
<div class="menubar">
  <a class="home"><i class="ti-home"></i></a>
  <span class="sep">|</span>
  <a><i class="fa fa-users"></i> Users <i class="fa fa-caret-down" style="font-size:10px"></i></a>
  <a><i class="ti-layout-grid2"></i> App Builder <i class="fa fa-caret-down" style="font-size:10px"></i></a>
  <a><i class="ti-server"></i> Database</a>
  <a><i class="fa fa-file-text-o"></i> Notes</a>
</div>
