<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
  body { padding: 28px 32px; background: #fff; font-family: "Bricolage Grotesque", sans-serif; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 18px;
    font: 500 13px/1 "Bricolage Grotesque", sans-serif;
    font-variation-settings: "opsz" 14;
    letter-spacing: -0.005em;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }

  /* Primary — slate blue, quiet confidence */
  .btn--primary { background: #2d4a6b; color: #fff; }
  .btn--primary:hover { background: #23395a; }

  /* Secondary — neutral outline, near-invisible at rest */
  .btn--secondary { background: #fff; color: #0f1b2d; border-color: #dde3e7; }
  .btn--secondary:hover { background: #f4f6f8; border-color: #c9d2d9; }

  /* Ghost — no chrome, for repeated row actions */
  .btn--ghost { background: transparent; color: #6c757d; }
  .btn--ghost:hover { background: #f4f6f8; color: #0f1b2d; }

  /* Accent — ochre, for affirmative / "featured" moments */
  .btn--accent { background: #b08968; color: #fff; }
  .btn--accent:hover { background: #96724f; }

  /* Semantic (pastel-solid): sage / honey / clay */
  .btn--success { background: #6b8e6f; color: #fff; }
  .btn--success:hover { background: #56765a; }
  .btn--warning { background: #f6efe7; color: #8a6d48; border-color: #e7d9c7; }
  .btn--warning:hover { background: #eee0cc; }
  .btn--danger  { background: #f4eaea; color: #8a4a4a; border-color: #e4cece; }
  .btn--danger:hover  { background: #ebd7d7; color: #703c3c; }

  .btn--xs { padding: 4px 10px; font-size: 11px; gap: 5px; }
  .btn--sm { padding: 6px 12px; font-size: 12px; }
  .btn--lg { padding: 11px 20px; font-size: 14px; }

  /* Eyebrow */
  .eyebrow {
    display: flex; align-items: baseline; gap: 12px;
    margin: 0 0 12px;
  }
  .eyebrow:not(:first-child) { margin-top: 22px; }
  .eyebrow .caps {
    font: 600 9.5px/1.2 SFMono-Regular, Menlo, Consolas, monospace;
    text-transform: uppercase; letter-spacing: 1.4px; color: #9aacb8;
  }
  .eyebrow .dot { flex: 1; height: 1px; background: #eef0f2; align-self: center; }
  .eyebrow .serif {
    font-family: "Libre Baskerville", Georgia, serif;
    font-size: 11px; color: #9aacb8;
  }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>

<div class="eyebrow">
  <span class="caps">Hierarchy</span>
  <span class="dot"></span>
  <span class="serif">Primary · Secondary · Ghost · Accent</span>
</div>
<div class="row">
  <button class="btn btn--primary"><i class="fa fa-plus"></i> Add User</button>
  <button class="btn btn--secondary"><i class="fa fa-download"></i> Export CSV</button>
  <button class="btn btn--ghost"><i class="fa fa-eye"></i> View</button>
  <button class="btn btn--accent"><i class="fa fa-star"></i> Feature</button>
</div>

<div class="eyebrow">
  <span class="caps">Semantic</span>
  <span class="dot"></span>
  <span class="serif">Sage · Honey · Clay</span>
</div>
<div class="row">
  <button class="btn btn--success"><i class="fa fa-check"></i> Approve</button>
  <button class="btn btn--warning"><i class="fa fa-pause"></i> Deactivate</button>
  <button class="btn btn--danger"><i class="fa fa-trash"></i> Delete</button>
</div>

<div class="eyebrow">
  <span class="caps">Sizes</span>
  <span class="dot"></span>
  <span class="serif">xs · sm · md · lg</span>
</div>
<div class="row">
  <button class="btn btn--primary btn--xs">Edit</button>
  <button class="btn btn--primary btn--sm">New App</button>
  <button class="btn btn--primary">Save Changes</button>
  <button class="btn btn--primary btn--lg">Sign In</button>
</div>
