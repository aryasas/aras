<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .swatch { border-radius: 6px; overflow: hidden; border: 1px solid #eef0f2; }
  .tile { height: 56px; }
  .meta { padding: 6px 8px; background: #fff; }
  .hex { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; color: #313b3d; }
  .name { font-size: 10px; color: #6c757d; margin-top: 1px; }
  h3 { font-size: 11px; margin: 0 0 6px; color: #9aacb8; text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
</style>
<h3>Ink (text)</h3>
<div class="grid">
  <div class="swatch"><div class="tile" style="background:#313b3d"></div><div class="meta"><div class="hex">#313b3d</div><div class="name">ink · primary</div></div></div>
  <div class="swatch"><div class="tile" style="background:#6c757d"></div><div class="meta"><div class="hex">#6c757d</div><div class="name">ink 2 · muted</div></div></div>
  <div class="swatch"><div class="tile" style="background:#8a9bb0"></div><div class="meta"><div class="hex">#8a9bb0</div><div class="name">ink 3 · icon</div></div></div>
  <div class="swatch"><div class="tile" style="background:#9aacb8"></div><div class="meta"><div class="hex">#9aacb8</div><div class="name">ink 4 · crumb</div></div></div>
  <div class="swatch"><div class="tile" style="background:#ffffff;border:1px solid #eef0f2"></div><div class="meta"><div class="hex">#ffffff</div><div class="name">on-ink text</div></div></div>
</div>
<h3 style="margin-top:16px">Lines & surfaces</h3>
<div class="grid">
  <div class="swatch"><div class="tile" style="background:#dde3e7"></div><div class="meta"><div class="hex">#dde3e7</div><div class="name">line 2 · btn border</div></div></div>
  <div class="swatch"><div class="tile" style="background:#eef0f2"></div><div class="meta"><div class="hex">#eef0f2</div><div class="name">line · hairline</div></div></div>
  <div class="swatch"><div class="tile" style="background:#f0f3f5"></div><div class="meta"><div class="hex">#f0f3f5</div><div class="name">line 3 · soft</div></div></div>
  <div class="swatch"><div class="tile" style="background:#f4f6f8"></div><div class="meta"><div class="hex">#f4f6f8</div><div class="name">surface · hover</div></div></div>
  <div class="swatch"><div class="tile" style="background:#f8f9fa"></div><div class="meta"><div class="hex">#f8f9fa</div><div class="name">bg · page</div></div></div>
</div>
