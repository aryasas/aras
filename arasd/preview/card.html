<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
  body {
    background: #f4f6f8; padding: 28px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-variation-settings: "opsz" 14;
    color: #0f1b2d;
  }

  .card {
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(15,27,45,.04), 0 0 0 1px rgba(15,27,45,.04);
  }
  .card-body { padding: 22px 26px; }

  /* Header */
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .title-wrap { display: flex; align-items: baseline; gap: 10px; }
  h4 {
    font-family: "Libre Baskerville", Georgia, serif;
    font-weight: 700;
    font-size: 18px;
    margin: 0;
    color: #0f1b2d;
    letter-spacing: -0.01em;
  }
  .count {
    font: 500 12px "Bricolage Grotesque", sans-serif;
    font-variant-numeric: tabular-nums;
    color: #9aacb8;
    letter-spacing: .2px;
  }

  /* New button — slate, flat, no gradient */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 14px;
    font: 500 12px/1 "Bricolage Grotesque", sans-serif;
    font-variation-settings: "opsz" 12;
    letter-spacing: -0.005em;
    background: #2d4a6b; color: #fff;
    border: 0; border-radius: 3px; cursor: pointer;
    transition: background .15s ease;
  }
  .btn:hover { background: #23395a; }
  .btn i { font-size: 10px; opacity: .85; }

  hr { border: 0; border-top: 1px solid #eef0f2; margin: 18px 0 10px; }

  /* Row */
  .row6 {
    display: flex; gap: 14px; align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #f4f6f8;
  }
  .row6:last-child { border-bottom: 0; }

  /* Flat square avatar — calm pastel, serif initials, no gradient */
  .avatar {
    width: 36px; height: 36px;
    border-radius: 3px;
    background: #eef2f7;
    color: #2d4a6b;
    display: flex; align-items: center; justify-content: center;
    font-family: "Libre Baskerville", Georgia, serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .3px;
    flex-shrink: 0;
  }
  .avatar.a2 { background: #f6efe7; color: #8a6d48; }
  .avatar.a3 { background: #eef3ee; color: #4f6f53; }
  .avatar.a4 { background: #f4eaea; color: #8a4a4a; }

  .row6 .n {
    flex: 1;
    font: 500 14px/1.3 "Bricolage Grotesque", sans-serif;
    color: #0f1b2d;
    letter-spacing: -0.005em;
  }
  .row6 .m {
    font-family: "Libre Baskerville", Georgia, serif;
    font-style: italic;
    font-size: 12px;
    color: #9aacb8;
  }
</style>

<div class="card">
  <div class="card-body">
    <div class="head">
      <div class="title-wrap">
        <h4>All Users</h4>
        <span class="count">4 people</span>
      </div>
      <button class="btn"><i class="fa fa-plus"></i> Add User</button>
    </div>

    <hr>

    <div class="row6">
      <div class="avatar">JD</div>
      <div class="n">jdoe</div>
      <div class="m">joined 12 Apr 2025</div>
    </div>
    <div class="row6">
      <div class="avatar a2">AH</div>
      <div class="n">ayu.h</div>
      <div class="m">joined 09 Mar 2025</div>
    </div>
    <div class="row6">
      <div class="avatar a3">RS</div>
      <div class="n">rashed</div>
      <div class="m">joined 02 Jan 2025</div>
    </div>
    <div class="row6">
      <div class="avatar a4">MA</div>
      <div class="n">maya</div>
      <div class="m">joined 18 Feb 2025</div>
    </div>
  </div>
</div>
