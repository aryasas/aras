{% extends 'admin/base_admin.html' %}
{% block page_content %}
<div class="row mt-4 justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body p-4">
        <h5 class="mb-1">Buka Sesi POS</h5>
        <p class="text-muted mb-4">Terminal: <strong>{{ terminal.name }}</strong></p>
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-group">
            <label>Saldo Kas Awal</label>
            <input type="number" name="opening_balance" class="form-control" value="0" min="0" step="1000">
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="fa fa-play mr-1"></i> Buka Sesi
            </button>
            <a href="{{ url_for('erp_views.pos_home') }}" class="btn btn-secondary">Batal</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
