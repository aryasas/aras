{% extends 'admin/adm_base.html' %}
{% block page_content %}
<div class="row mt-4 justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body p-4">
        <h5 class="mb-1">Tutup Sesi POS</h5>
        <p class="text-muted">Terminal: <strong>{{ session.terminal.name }}</strong></p>
        <hr>
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <span>Saldo Awal</span>
            <strong>{{ "{:,.0f}".format(session.opening_balance) }}</strong>
          </div>
          <div class="d-flex justify-content-between">
            <span>Total Order</span>
            <strong>{{ session.orders.count() }}</strong>
          </div>
        </div>
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-group">
            <label>Kas Terhitung</label>
            <input type="number" name="cash_counted" class="form-control" value="0" min="0" step="1000">
          </div>
          <div class="form-group">
            <label>Catatan</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-danger">
              <i class="fa fa-stop mr-1"></i> Tutup Sesi
            </button>
            <a href="{{ url_for('erp_views.pos_session', session_id=session.id) }}" class="btn btn-secondary">Kembali</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
