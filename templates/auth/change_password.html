{% extends 'admin/adm_base.html' %}

{% block page_content %}
<div class="main-content-inner">
  <div class="mt-4" style="max-width:480px;">
    <div class="aras-form-card">
      <div class="aras-form-card-header">
        <h2 class="aras-form-title">Change Password</h2>
      </div>
      <div class="aras-form-body">
        <form action="{{ url_for('auth.change_password') }}" method="POST" id="mainForm">
          {{ form.hidden_tag() }}
          {% include 'admin/base_form_fields.html' %}
          <div class="aras-form-footer">
            <button type="submit" class="aras-btn aras-btn--primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
