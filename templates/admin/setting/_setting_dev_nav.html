{# Developer Tools Navigation Header #}
<div class="settings-panel-header mb-4">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h3 class="settings-panel-title"><i class="ti-dashboard"></i> {{ main_title|default('Developer Tools') }}</h3>
            <p class="settings-panel-desc">Advanced debugging information, system internals, and registered route mapping.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="{{ url_for('admin.dev') }}" class="btn btn-sm {{ 'btn-dark' if request.endpoint == 'admin.dev' else 'btn-outline-dark' }}">
                <i class="fa fa-map-signs mr-1"></i> Routes
            </a>
            <a href="{{ url_for('admin.dev_logs') }}" class="btn btn-sm {{ 'btn-dark' if request.endpoint == 'admin.dev_logs' else 'btn-outline-dark' }}">
                <i class="fa fa-list-alt mr-1"></i> Logs
            </a>
            <a href="{{ url_for('admin.dev_components') }}" class="btn btn-sm {{ 'btn-dark' if request.endpoint == 'admin.dev_components' else 'btn-outline-dark' }}">
                <i class="fa fa-cube mr-1"></i> UI Kit
            </a>
            <a href="{{ url_for('admin.dev_sql') }}" class="btn btn-sm {{ 'btn-dark' if request.endpoint == 'admin.dev_sql' else 'btn-outline-dark' }}">
                <i class="fa fa-database mr-1"></i> SQL
            </a>
            <a href="{{ url_for('admin.dev_sync') }}" class="btn btn-sm {{ 'btn-dark' if request.endpoint == 'admin.dev_sync' else 'btn-outline-dark' }}">
                <i class="fa fa-refresh mr-1"></i> Sync
            </a>
        </div>
    </div>
</div>
