{# 
  Generic Visual Form Builder — High-Fidelity WYSIWYG Mock
  Renders fields as they appear in the actual Aras Admin forms.
#}

<link rel="stylesheet" href="{{ url_for('static', filename='css/form_builder.css') }}">

<div id="aras-form-builder-root">
    <div class="text-center py-5">
        <div class="spinner-grow" style="color: var(--aras-accent);" role="status"></div>
        <p class="mt-3 text-muted fw-bold">Synchronizing Form Architecture...</p>
    </div>
</div>

<script>
window.FORM_BUILDER_TABLE_ID    = {{ tbl.id }};
window.FORM_BUILDER_CHILD_TABLES = {{ (child_tables or [])|tojson|safe }};
window.LAYOUT_RESET_URL          = "{{ url_for('admin.apps_table_layout_reset', app_id=app_def.id, table_id=tbl.id) }}";
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script type="text/babel" src="{{ url_for('static', filename='js/form_builder.js') }}"></script>
