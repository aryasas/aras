<!-- Aras Top Bar -->
<header class="aras-top-bar">
    <div class="aras-top-bar__left">
        <button
            class="aras-btn aras-btn--sm d-lg-none"
            id="mobileSidebarToggle"
        >
            <i class="ti-menu"></i>
        </button>
        <!--<div class="aras-breadcrumb">
            <h1>{% if title %}{{ title }}{% else %}Operations{% endif %}</h1>
        </div>-->
    </div>

    <div class="aras-top-bar__right">
        <div class="aras-search-wrap d-none d-md-flex">
            <i class="ti-search text-muted"></i>
            <input
                type="text"
                id="arasTopSearchInput"
                placeholder="Search resources... (⌘K)"
                autocomplete="off"
            />
            <div
                id="arasTopSearchResults"
                class="aras-top-search-results"
            ></div>
        </div>

        <div class="aras-top-bar__right-actions">
            <button class="aras-btn aras-btn--sm" id="rightSidebarToggle" title="Toggle Sidebar">
                <i class="ti-layout-sidebar-right"></i>
            </button>
        </div>
    </div>
</header>
