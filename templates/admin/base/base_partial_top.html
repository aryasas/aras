<!-- Aras Top Bar -->
<header class="aras-top-bar" role="banner">
    <div class="aras-top-bar__left">
        <button
            class="aras-btn aras-btn--sm d-lg-none"
            id="mobileSidebarToggle"
            aria-label="Open sidebar"
        >
            <i class="ti-menu"></i>
        </button>
    </div>

    <div class="aras-top-bar__right">
        <div class="aras-search-wrap d-none d-md-flex" role="search">
            <i class="ti-search text-muted" aria-hidden="true"></i>
            <input
                type="text"
                id="arasTopSearchInput"
                placeholder="Search resources... (⌘K)"
                autocomplete="off"
                aria-label="Search resources"
            />
            <div
                id="arasTopSearchResults"
                class="aras-top-search-results"
                aria-live="polite"
            ></div>
        </div>

        <div class="aras-top-bar__right-actions">
            <button 
                class="aras-btn aras-btn--sm" 
                id="themeToggle" 
                title="Toggle Dark Mode"
                aria-label="Toggle Dark Mode"
            >
                <i class="fa fa-sun-o"></i>
            </button>
            <button 
                class="aras-btn aras-btn--sm" 
                id="rightSidebarToggle" 
                title="Toggle Sidebar"
                aria-label="Toggle Right Sidebar"
            >
                <i class="ti-layout-sidebar-right"></i>
            </button>
        </div>
    </div>
</header>
