<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="csrf-token" content="{{ csrf_token() }}">

<title>Aras |
  {% if main_title %}
    {{ main_title }}
  {% endif %}
</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='images/icon/logo.png') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/themify-icons.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/aras_design.css') }}">

<!-- Third Party Components -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css">

<style>
  /* Tom Select Aras Polish */
  .ts-control { border: 1px solid var(--aras-line-2) !important; border-radius: 4px !important; padding: 9px 12px !important; font-size: 13.5px !important; transition: all 0.2s !important; }
  .ts-control:focus { border-color: var(--studio-ochre) !important; box-shadow: 0 0 0 3px rgba(201, 165, 104, 0.1) !important; }
  .ts-dropdown { border: 1px solid var(--studio-ochre) !important; border-radius: 4px !important; box-shadow: var(--aras-shadow-drop) !important; }
  .ts-dropdown .active { background-color: var(--studio-cream) !important; color: var(--studio-ink) !important; }
  
  /* Quill Aras Polish */
  .ql-toolbar { border-color: var(--aras-line-2) !important; border-top-left-radius: 4px; border-top-right-radius: 4px; background: var(--studio-paper); }
  .ql-container { border-color: var(--aras-line-2) !important; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; font-family: var(--aras-font-sans) !important; font-size: 13.5px !important; min-height: 150px; }
</style>

<script>
    // Early detection to prevent sidebar flicker
    (function() {
        var isMini = localStorage.getItem('aras-sidebar-mini') === 'true';
        if (isMini) {
            document.documentElement.classList.add('aras-mini-sidebar-active');
        }
    })();
</script>
