<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="csrf-token" content="{{ csrf_token() }}">

<title>Aras |
  {% if main_title %}
    {{ main_title }}
  {% endif %}
</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='images/icon/logo.png') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/themify-icons.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/aras_design.css') }}?v=1.1">


<!-- Third Party Components -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css">

<style>
  /* Tom Select Aras Polish — defer styling to aras_design.css (no !important overrides) */

  /* Quill Aras Polish */
  .ql-toolbar { border-color: var(--aras-line-2) !important; border-top-left-radius: 4px; border-top-right-radius: 4px; background: var(--studio-paper); }
  .ql-container { border-color: var(--aras-line-2) !important; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; font-family: var(--aras-font-sans) !important; font-size: 13.5px !important; min-height: 150px; }

  {% if aras_theme_tokens %}
  :root {
    {% if aras_theme_tokens.get('studio_ink') %}--studio-ink: {{ aras_theme_tokens.studio_ink }};{% endif %}
    {% if aras_theme_tokens.get('studio_cream') %}--studio-cream: {{ aras_theme_tokens.studio_cream }};{% endif %}
    {% if aras_theme_tokens.get('studio_paper') %}--studio-paper: {{ aras_theme_tokens.studio_paper }};{% endif %}
    {% if aras_theme_tokens.get('studio_ochre') %}--studio-ochre: {{ aras_theme_tokens.studio_ochre }};{% endif %}
    {% if aras_theme_tokens.get('studio_accent') %}--studio-accent: {{ aras_theme_tokens.studio_accent }};{% endif %}
    {% if aras_theme_tokens.get('radius') %}--aras-radius: {{ aras_theme_tokens.radius }}px;{% endif %}
    {% if aras_theme_tokens.get('font_display') %}--aras-font-display: "{{ aras_theme_tokens.font_display }}", serif;{% endif %}
    {% if aras_theme_tokens.get('font_sans') %}--aras-font-sans: "{{ aras_theme_tokens.font_sans }}", system-ui, sans-serif;{% endif %}
  }
  {% endif %}
</style>

<script>
    // Early detection to prevent UI flicker
    (function() {
        var isMini = localStorage.getItem('aras-sidebar-mini') === 'true';
        if (isMini) {
            document.documentElement.classList.add('aras-mini-sidebar-active');
        }

        var theme = localStorage.getItem('aras-theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    })();

    window.ArasConfig = {
        numberFormat: {
            thousandsSep: "{{ get_number_format(app_slug)[0] }}",
            decimalSep: "{{ get_number_format(app_slug)[1] }}",
            precision: {{ get_decimal_precision(app_slug) }}
        }
    };
</script>
