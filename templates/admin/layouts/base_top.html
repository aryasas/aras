<!-- header area start -->
<div class="aras-top-bar">
    <div class="aras-top-bar__left">
        <!-- Sidebar Toggle -->
        <button class="aras-top-toggle" id="sidebarCollapse" title="Toggle Sidebar">
            <i class="ti-menu"></i>
        </button>

        <!-- Breadcrumbs -->
        <nav class="aras-breadcrumb d-none d-md-flex">
            <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
            <span style="opacity: 0.3">/</span>
            {% if title %}
                <span class="aras-breadcrumb__current">{{ title }}</span>
            {% elif main_title %}
                <span class="aras-breadcrumb__current">{{ main_title }}</span>
            {% else %}
                <span class="aras-breadcrumb__current">Studio</span>
            {% endif %}
        </nav>
    </div>

    <div class="aras-top-bar__right">
        <!-- Global Search (Integrated) -->
        <div class="aras-top-search-container">
            <div class="aras-top-search-input-wrap">
                <i class="fa fa-search"></i>
                <input type="text" id="arasTopSearchInput" placeholder="Search Studio... (⌘K)" autocomplete="off">
            </div>
            <div id="arasTopSearchResults" class="aras-top-search-results"></div>
        </div>

        <!-- System Icons -->
        <div class="aras-top-bar__actions d-none d-sm-flex" style="gap: 12px;">
            <button class="aras-top-toggle" id="full-view" title="Toggle Fullscreen">
                <i class="ti-fullscreen"></i>
            </button>
            <button class="aras-top-toggle" id="full-view-exit" style="display:none;" title="Exit Fullscreen">
                <i class="ti-zoom-out"></i>
            </button>
        </div>

        <!-- User Profile -->
        {% if current_user.is_authenticated %}
        <div class="dropdown">
            <div class="aras-top-user dropdown-toggle" data-toggle="dropdown">
                <div class="aras-user-avatar">
                    {{ current_user.username[0]|upper }}
                </div>
                <span style="font-size: 13px; font-weight: 600; color: var(--studio-ink);" class="d-none d-md-inline">
                    {{ current_user.username }}
                </span>
            </div>
            <div class="dropdown-menu dropdown-menu-right shadow-sm border-light" style="border-radius: 4px; margin-top: 10px; border: 1px solid var(--studio-ochre);">
                <div class="dropdown-header text-uppercase small font-weight-bold" style="letter-spacing: 1px; color: var(--aras-ink-3); font-size: 10px;">User Menu</div>
                <a class="dropdown-item py-2" style="font-size: 13px;" href="{{ url_for('admin.user_detail', user_id=current_user.id) }}">
                    <i class="ti-user mr-2 text-muted"></i> My Profile
                </a>
                <a class="dropdown-item py-2" style="font-size: 13px;" href="{{ url_for('admin.settings') }}">
                    <i class="ti-settings mr-2 text-muted"></i> Account Settings
                </a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item py-2 text-danger" style="font-size: 13px;" href="{{ url_for('auth.logout_view') }}">
                    <i class="ti-power-off mr-2"></i> Log out
                </a>
            </div>
        </div>
        {% endif %}
    </div>
</div>
<!-- header area end -->
