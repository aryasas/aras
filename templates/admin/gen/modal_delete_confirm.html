<div id="arasDeleteModal" class="aras-modal" style="display:none;">
    <div class="aras-modal__overlay" id="arasDeleteModalOverlay"></div>
    <div class="aras-modal__content" style="max-width:520px;">
        <div class="aras-modal-header" style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
            <strong style="font-size:14px;"><i class="fa fa-trash text-danger mr-2"></i> Confirm Deletion</strong>
            <button id="arasDeleteModalClose" class="aras-btn aras-btn--sm" style="padding:4px 8px;line-height:1;">&times;</button>
        </div>
        <div class="aras-modal-body" id="arasDeleteModalBody" style="padding:20px;">
        </div>
        <div class="aras-modal-footer" style="padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;">
            <button id="arasDeleteModalConfirm" class="aras-btn aras-btn--danger" style="flex:1;">
                <i class="fa fa-trash"></i> Delete All
            </button>
            <button id="arasDeleteModalCancel" class="aras-btn aras-btn--outline">Cancel</button>
        </div>
    </div>
</div>
