{# 
  Generic Visual Form Builder — High-Fidelity WYSIWYG Mock
  Renders fields as they appear in the actual Aras Admin forms.
#}

<style>
    :root {
        --builder-bg: var(--aras-bg);
        --builder-border: var(--studio-ochre);
        --builder-sidebar-w: 280px;
    }

    .aras-builder-wrapper {
        display: flex;
        height: calc(100vh - 200px);
        background: var(--builder-bg);
        border: 1px solid var(--builder-border);
        border-radius: var(--aras-radius);
        overflow: hidden;
        font-family: var(--aras-font-sans);
    }

    /* TOOLBOX SIDEBAR */
    .builder-sidebar {
        width: var(--builder-sidebar-w);
        border-right: 1px solid var(--builder-border);
        background: #fff;
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 16px;
        border-bottom: 1px solid var(--aras-line);
        background: var(--studio-paper);
    }

    .sidebar-header h6 {
        margin: 0;
        font-family: var(--aras-font-serif);
        font-weight: 700;
        font-size: 0.85rem;
        color: var(--studio-ink);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .field-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
    }

    .field-draggable {
        padding: 10px 14px;
        background: #fff;
        border: 1px solid var(--aras-line-2);
        border-radius: var(--aras-radius);
        margin-bottom: 8px;
        font-size: 13px;
        cursor: grab;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.2s;
        color: var(--studio-ink);
    }

    .field-draggable:hover {
        border-color: var(--studio-accent);
        background: var(--studio-cream);
        box-shadow: var(--aras-shadow-sm);
    }

    .field-draggable.is-used {
        opacity: 0.4;
        cursor: not-allowed;
        background: var(--aras-line-3);
    }

    .core-badge {
        font-size: 9px;
        padding: 1px 4px;
        background: var(--studio-ochre);
        color: #fff;
        border-radius: 2px;
        font-weight: 700;
    }

    /* CANVAS */
    .builder-canvas {
        flex: 1;
        background: var(--studio-cream);
        overflow-y: auto;
        padding: 30px;
    }

    .canvas-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    
    .canvas-header h4 {
        font-family: var(--aras-font-serif);
        font-weight: 700;
        color: var(--studio-ink);
    }

    /* MOCK FORM STYLING */
    .mock-form-card {
        background: #fff;
        border-radius: var(--aras-radius);
        box-shadow: var(--aras-shadow-drop);
        min-height: 600px;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--aras-line-2);
    }

    .mock-tab-strip {
        display: flex;
        border-bottom: 1px solid var(--studio-ochre);
        padding: 0 20px;
        background: #fff;
        gap: 4px;
    }

    .mock-tab-item {
        padding: 12px 20px;
        font-size: 13px;
        font-weight: 600;
        color: var(--aras-ink-3);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        transition: all 0.2s;
    }

    .mock-tab-item.active {
        color: var(--studio-accent);
        border-bottom-color: var(--studio-accent);
        background: var(--studio-paper);
    }

    .active-tab-container {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .tab-config-strip {
        background: var(--studio-paper);
        border-bottom: 1px solid var(--aras-line-2);
        padding: 8px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .mock-form-body {
        padding: 30px;
        flex: 1;
    }

    .mock-section {
        border: 1px dashed var(--aras-line-2);
        margin-bottom: 20px;
        padding: 15px;
        border-radius: var(--aras-radius);
        transition: all 0.2s;
        position: relative;
        background: #fff;
    }

    .mock-section.drag-over {
        border-color: var(--studio-accent);
        background: var(--studio-accent-50);
    }

    .section-title {
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--aras-line-3);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .section-title input {
        font-family: var(--aras-font-serif);
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--studio-ink);
        font-size: 0.75rem;
        background: transparent;
        border: none;
        outline: none;
    }

    /* Horizontal Field Mock (Aras Design 4.0) */
    .mock-field-group {
        position: relative;
        border-bottom: 1px solid var(--aras-line-3);
    }
    
    .mock-label {
        width: 140px;
        flex-shrink: 0;
        font-weight: 600;
        font-size: 12px;
        color: var(--studio-ink);
    }

    .field-actions {
        position: absolute;
        top: 0; right: 0;
        display: none;
        z-index: 10;
    }
    .mock-field-group:hover .field-actions,
    .mock-field-group:hover .field-actions-trigger {
        display: block;
        opacity: 1;
    }

    .btn-ghost-sec {
        width: 100%;
        padding: 12px;
        border: 1px dashed var(--studio-ochre);
        background: transparent;
        color: var(--aras-ink-3);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-radius: var(--aras-radius);
        margin-top: 10px;
        transition: all 0.2s;
    }
    .btn-ghost-sec:hover {
        background: var(--studio-paper);
        color: var(--studio-accent);
    }
    
    .btn-xs { padding: 1px 5px; font-size: 10px; }
</style>

<div id="aras-form-builder-root">
    <div class="text-center py-5">
        <div class="spinner-grow text-primary" role="status"></div>
        <p class="mt-3 text-muted fw-bold">Synchronizing Form Metadata...</p>
    </div>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
    const { useState, useEffect } = React;

    function FormBuilder() {
        const [table, setTable] = useState(null);
        const [columns, setColumns] = useState([]);
        const [layout, setLayout] = useState([]);
        const [activeTabIdx, setActiveTabIdx] = useState(0);
        const [loading, setLoading] = useState(true);
        const [dragOverSection, setDragOverSection] = useState(null);
        const [childTables, setChildTables] = useState([]);

        useEffect(() => {
            const tableId = {{ tbl.id }};
            Promise.all([
                fetch(`/api/admin/apps/tables/${tableId}/`).then(r => r.json()),
                fetch(`/api/admin/apps/tables/columns/?filter[table_id]=${tableId}&per_page=200`).then(r => r.json()),
                fetch(`/api/admin/apps/tables/?filter[parent_table_id]=${tableId}&per_page=100`).then(r => r.json())
            ]).then(([tableData, colsData, childData]) => {
                // Only show fields that are visible in the form — mgr_column.show_in_form is the source of truth
                let fetchedCols = (colsData.data || []).filter(c => c.show_in_form !== false);
                setColumns(fetchedCols);
                if (childData.data) setChildTables(childData.data);

                if (tableData.id) {
                    const tableTitle = tableData.title || tableData.name || 'General';
                    setTable(tableData);
                    let parsed = tableData.layout_json;
                    let initialLayout = typeof parsed === 'string' ? JSON.parse(parsed) : (parsed || []);
                    
                    // 1. AUTO-BOOTSTRAP
                    if (initialLayout.length === 0 && fetchedCols.length > 0) {
                        initialLayout = [{
                            type: 'tab',
                            label: tableTitle,
                            sections: [{
                                type: 'section',
                                label: 'Main Details',
                                width: 12,
                                fields: fetchedCols.map(c => ({ name: c.name, width: 6 }))
                            }]
                        }];
                    }

                    // 2. DATA INTEGRITY & UPGRADE
                    initialLayout = initialLayout.map(t => {
                        let label = t.label;
                        if (label === 'Test Tab' || label === 'General' || !label) label = tableTitle;
                        return {
                            ...t,
                            label: label,
                            sections: (t.sections || []).filter(s => s.type !== 'column_break').map(s => ({
                                ...s,
                                width: s.width || 12,
                                fields: (s.fields || []).map(f => typeof f === 'string' ? { name: f, width: 12 } : f)
                            }))
                        };
                    });

                    // 3. AUTO-RECOVERY
                    const usedFields = new Set();
                    initialLayout.forEach(t => (t.sections || []).forEach(s => (s.fields || []).forEach(f => usedFields.add(f.name))));
                    
                    const missingCols = fetchedCols.filter(c => !usedFields.has(c.name));
                    if (missingCols.length > 0 && initialLayout.length > 0) {
                        const firstTab = initialLayout[0];
                        if (!firstTab.sections) firstTab.sections = [];
                        firstTab.sections.push({
                            type: 'section',
                            label: 'Unarranged Fields',
                            width: 12,
                            fields: missingCols.map(c => ({ name: c.name, width: 12 }))
                        });
                    }

                    setLayout(initialLayout);
                }
                setLoading(false);
            }).catch(err => { console.error(err); setLoading(false); });
        }, []);

        const getCol = (name) => columns.find(c => c.name === name) || { label: name, field_type: 'string' };
        
        const isFieldUsed = (fieldName) => {
            let used = false;
            layout.forEach(t => (t.sections || []).forEach(s => (s.fields || []).forEach(f => { if(f.name === fieldName) used = true; })));
            return used;
        };

        const onDragStart = (e, fieldName) => { e.dataTransfer.setData("fieldName", fieldName); };
        const onDragOver = (e, id) => { e.preventDefault(); setDragOverSection(id); };

        const onDrop = (e, tIdx, sIdx) => {
            e.preventDefault();
            setDragOverSection(null);
            const fieldName = e.dataTransfer.getData("fieldName");
            if (!fieldName) return;
            const newLayout = [...layout];
            if (!newLayout[tIdx].sections[sIdx].fields) newLayout[tIdx].sections[sIdx].fields = [];
            if (!newLayout[tIdx].sections[sIdx].fields.find(f => f.name === fieldName)) {
                newLayout[tIdx].sections[sIdx].fields.push({ name: fieldName, width: 12 });
                setLayout(newLayout);
            }
        };

        const updateFieldWidth = (tIdx, sIdx, fIdx, width) => {
            const nl = [...layout];
            nl[tIdx].sections[sIdx].fields[fIdx].width = width;
            setLayout(nl);
        };

        const updateSectionWidth = (tIdx, sIdx, width) => {
            const nl = [...layout];
            nl[tIdx].sections[sIdx].width = width;
            setLayout(nl);
        };

        const MockInput = ({ col }) => {
            if (col.field_type === 'boolean') {
                return (
                    <div className="aras-toggle active" style={ {transform: 'scale(0.8)', transformOrigin: 'left'} }>
                        <span className="aras-toggle-track" style={ {background: '#4f6f53'} }>
                            <span className="aras-toggle-thumb" style={ {transform: 'translateX(16px)'} }></span>
                        </span>
                        <span className="aras-toggle-label">{col.label}</span>
                    </div>
                );
            }
            if (col.field_type === 'select' || col.field_type === 'relation') {
                return (
                    <div className="aras-form-select text-muted" style={ {padding: '6px 12px', fontSize:'12px'} }>
                        Select {col.label}...
                    </div>
                );
            }
            if (col.field_type === 'text' || col.field_type === 'json') {
                return <div className="aras-form-textarea text-muted" style={ {minHeight: '40px', fontSize:'12px'} }>Large text...</div>;
            }
            return (
                <div className="aras-form-input text-muted" style={ {padding: '6px 12px', fontSize:'12px'} }>
                    {col.field_type === 'date' ? 'YYYY-MM-DD' : 
                     col.field_type === 'datetime' ? 'YYYY-MM-DD HH:mm' :
                     col.field_type === 'decimal' || col.field_type === 'float' ? '0.00' :
                     `Enter ${col.label}...`}
                </div>
            );
        };

        const getCsrf = () => {
            const m = document.cookie.match(/csrf_token=([^;]+)/);
            if (m) return decodeURIComponent(m[1]);
            const tag = document.querySelector('input[name="csrf_token"]');
            if (tag) return tag.value;
            return "{{ csrf_token() }}";
        };

        const saveLayout = async () => {
            try {
                const layoutToSave = layout.map(tab => {
                    return {
                        ...tab,
                        sections: (tab.sections || []).filter(s => s.type !== 'column_break')
                    };
                });

                const res = await fetch(`/admin/apps/{{ tbl.app_id }}/tables/{{ tbl.id }}/layout`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrf()
                    },
                    body: JSON.stringify({ layout: layoutToSave })
                });
                const data = await res.json();
                if (data.ok) {
                    Swal.fire({ icon: 'success', title: 'Form Updated', timer: 1500, showConfirmButton: false });
                } else {
                    const errTxt = typeof data.error === 'object' ? JSON.stringify(data.error) : (data.error || 'Unknown error');
                    Swal.fire({ icon: 'error', title: 'Save Failed', text: errTxt });
                }
            } catch (err) {
                console.error(err);
                Swal.fire({ icon: 'error', title: 'Network Error', text: err.message });
            }
        };

        if (loading) return <div className="text-center py-5"><div className="spinner-grow text-primary"></div></div>;
        if (!table) return <div className="alert alert-danger">Table configuration missing.</div>;

        const activeTab = layout[activeTabIdx];

        return (
            <div className="aras-builder-wrapper">
                {/* TOOLBOX */}
                <aside className="builder-sidebar">
                    <div className="sidebar-header">
                        <h6>Form Fields</h6>
                        <small className="text-muted">Drag into sections</small>
                    </div>
                    <div className="field-list">
                        <div className="mb-3">
                            <a href={`/admin/apps/${table.app_id}/tables/${table.id}/columns`} className="btn btn-outline-secondary btn-sm w-100" style={ {borderStyle:'dashed'} }>
                                <i className="fa fa-plus me-1"></i> New Field
                            </a>
                        </div>
                        {columns.sort((a,b) => (a.order||0)-(b.order||0)).map(col => (
                            <div key={col.id} className={`field-draggable ${isFieldUsed(col.name) ? 'is-used' : ''}`} draggable={!isFieldUsed(col.name)} onDragStart={(e) => onDragStart(e, col.name)}>
                                <i className="fa fa-grip-vertical text-muted"></i>
                                <span className="flex-grow-1">{col.label}</span>
                                {col.is_standard_column && <span className="core-badge">STANDARD</span>}
                            </div>
                        ))}
                    </div>
                    <div className="p-3 border-top bg-light">
                        <button className="btn btn-primary btn-sm w-100 shadow-sm" onClick={saveLayout}>
                            <i className="fa fa-save me-2"></i> Save Layout
                        </button>
                    </div>
                </aside>

                {/* CANVAS */}
                <main className="builder-canvas">
                    <div className="canvas-header">
                        <h4 className="fw-bold mb-0 text-dark">{table.title} <small className="text-muted fw-normal ms-2">/ Designer</small></h4>
                        <button className="btn btn-outline-primary btn-sm" onClick={() => {
                            const label = prompt("Tab Name:");
                            if(label) setLayout([...layout, { type: 'tab', label, sections: [{type:'section', label:'Main', width:12, fields:[]}] }]);
                        }}>+ Add Tab</button>
                    </div>

                    <div className="mock-form-card">
                        <div className="mock-tab-strip">
                            {layout.map((tab, idx) => (
                                <div key={idx} className={`mock-tab-item ${activeTabIdx === idx ? 'active' : ''}`} onClick={() => setActiveTabIdx(idx)}>
                                    {tab.label}
                                </div>
                            ))}
                        </div>

                        {activeTab && (
                            <div className="active-tab-container">
                                <div className="tab-config-strip">
                                    <div className="d-flex align-items-center gap-4">
                                        <div className="d-flex align-items-center gap-2">
                                            <small className="text-muted">Rename Tab:</small>
                                            <input className="form-control form-control-sm" style={ {width:'150px'} } value={activeTab.label} onChange={(e) => {
                                                const nl = [...layout]; nl[activeTabIdx].label = e.target.value; setLayout(nl);
                                            }} />
                                        </div>
                                    </div>
                                    <button className="btn btn-link btn-xs text-danger" onClick={() => {
                                        const nl = [...layout]; nl.splice(activeTabIdx, 1); setLayout(nl); setActiveTabIdx(0);
                                    }}>Delete Tab</button>
                                </div>

                                <div className="mock-form-body">
                                    <div className="row">
                                        {(activeTab.sections || []).map((sec, sIdx) => {
                                            const sectionId = `${activeTabIdx}-${sIdx}`;
                                            const sWidth = sec.width || 12;
                                            return (
                                                <div key={sIdx} className={`col-md-${sWidth}`}>
                                                    <div className={`mock-section ${dragOverSection === sectionId ? 'drag-over' : ''}`} onDragOver={(e) => onDragOver(e, sectionId)} onDragLeave={() => setDragOverSection(null)} onDrop={(e) => onDrop(e, activeTabIdx, sIdx)}>
                                                        <div className="section-title">
                                                            <div className="d-flex align-items-center gap-3">
                                                                <input value={sec.label || ''} placeholder="SECTION TITLE" onChange={(e) => {
                                                                    const nl = [...layout]; nl[activeTabIdx].sections[sIdx].label = e.target.value; setLayout(nl);
                                                                }} />
                                                                <select 
                                                                    className="form-select form-select-xs py-0 opacity-50" 
                                                                    style={ {width:'70px', fontSize:'0.6rem'} }
                                                                    value={sWidth}
                                                                    onChange={(e) => updateSectionWidth(activeTabIdx, sIdx, parseInt(e.target.value))}
                                                                >
                                                                    <option value="12">Full</option>
                                                                    <option value="6">Half</option>
                                                                </select>
                                                            </div>
                                                            <i className="fa fa-times cursor-pointer text-danger opacity-25" onClick={() => {
                                                                const nl = [...layout]; nl[activeTabIdx].sections.splice(sIdx, 1); setLayout(nl);
                                                            }}></i>
                                                        </div>
                                                        <div className="row">
                                                            {(sec.fields || []).map((field, fIdx) => {
                                                                const col = getCol(field.name);
                                                                const width = field.width || 12;
                                                                return (
                                                                    <div key={fIdx} className={`col-md-${width} mb-1 position-relative mock-field-group`}>
                                                                        <div className="d-flex align-items-center" style={ {minHeight: '44px'} }>
                                                                            <div className="mock-label">{col.label}</div>
                                                                            <div className="flex-grow-1 position-relative">
                                                                                <MockInput col={col} />
                                                                                <div className="field-actions-trigger opacity-25" style={ {position:'absolute', top:'-15px', right:0} }>
                                                                                    <select className="form-select form-select-xs py-0 px-1" style={ {fontSize:'0.6rem', width:'60px'} } value={width} onChange={(e) => updateFieldWidth(activeTabIdx, sIdx, fIdx, parseInt(e.target.value))}>
                                                                                        <option value="12">Full</option>
                                                                                        <option value="6">Half</option>
                                                                                    </select>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                        <div className="field-actions" style={ {top: '12px', right: '5px'} }>
                                                                            <button className="btn btn-xs btn-danger p-0 shadow-sm rounded-circle" style={ {width:'16px', height:'16px'} } onClick={() => {
                                                                                const nl = [...layout]; nl[activeTabIdx].sections[sIdx].fields.splice(fIdx, 1); setLayout(nl);
                                                                            }}><i className="fa fa-times" style={ {fontSize:'0.6rem'} }></i></button>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                            {(sec.fields || []).length === 0 && (
                                                                <div className="text-center py-4 text-muted small border rounded bg-light" style={ {borderStyle:'dashed !important'} }>
                                                                    Drop fields here
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <button className="btn-ghost-sec" onClick={() => {
                                        const nl = [...layout];
                                        nl[activeTabIdx].sections = [...(nl[activeTabIdx].sections || []), { type:'section', label:'New Section', width: 12, fields:[] }];
                                        setLayout(nl);
                                    }}>+ Add New Section</button>
                                </div>
                            </div>
                        )}

                        {/* CHILD TABLES PREVIEW */}
                        {childTables.length > 0 && (
                            <div className="mt-5 border-top pt-4 px-4 pb-4 bg-light">
                                <h6 className="text-muted fw-bold mb-3" style={ {fontSize: '0.7rem', textTransform: 'uppercase', letterSpacing: '1px'} }>
                                    Child Tables (Auto-Detected)
                                </h6>
                                {childTables.map(ct => (
                                    <div key={ct.id} className="card shadow-none border mb-3">
                                        <div className="card-header bg-white py-2 px-3 d-flex justify-content-between align-items-center">
                                            <span className="fw-bold small">{ct.title}</span>
                                            <button className="btn btn-xs btn-outline-secondary disabled">+ Add Row</button>
                                        </div>
                                        <div className="card-body py-4 text-center text-muted small italic">
                                            List of {ct.title} will appear here...
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </main>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('aras-form-builder-root'));
    root.render(<FormBuilder />);
</script>
