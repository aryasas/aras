{% extends 'admin/adm_base.html' %}

{% block page_content %}
<div class="row mt-3">
  <div class="col-12">

    <!-- Group header -->
    <div class="card mb-3">
      <div class="card-body d-flex align-items-center">
        <div style="font-size:2.5rem;color:#5a6fd6;margin-right:18px;">
          <i class="fa {{ group_icon }}"></i>
        </div>
        <div style="flex:1;">
          <h4 class="mb-1">{{ group_title }}</h4>
          <p class="mb-0 text-muted" style="font-size:13px;">
            <a href="{{ back_url }}">{{ app_title }}</a> &rsaquo; {{ group_title }}
          </p>
        </div>
        <div>
          <a href="{{ back_url }}" class="btn btn-sm btn-outline-secondary">
            <i class="fa fa-arrow-left mr-1"></i>Back
          </a>
        </div>
      </div>
    </div>

    <!-- Resource tiles -->
    <div class="card">
      <div class="card-body">
        {% if not tiles %}
          <p class="text-muted mb-0">No pages in this group.</p>
        {% else %}
          <div class="row">
            {% for t in tiles %}
              <div class="col-md-3 col-sm-6 mb-3">
                <a href="{{ t.url }}" class="text-dark" style="text-decoration:none;">
                  <div class="card h-100 tile-card" style="transition:transform .1s,box-shadow .1s;">
                    <div class="card-body text-center py-4">
                      <div style="font-size:2rem;color:#5a6fd6;">
                        <i class="fa {{ t.icon }}"></i>
                      </div>
                      <div class="mt-2" style="font-weight:600;">{{ t.title }}</div>
                    </div>
                  </div>
                </a>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      </div>
    </div>

  </div>
</div>

<style>
  .tile-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,.08);
  }
</style>
{% endblock %}
