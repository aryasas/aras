app:
  name: test_yml_app
  title: Test YML App
  main_title: Test YML App
  url: /test-yml-app
  endpoint: test_yml_app
  description: Install test via .yml
  icon: fa-file-text-o
  is_active: true
  in_sidebar: true
  require_login: true
  api_enabled: true
  items_per_page: 20

tables:
  - name: tasks
    title: Tasks
    url_suffix: /tasks
    menu_title: Tasks
    menu_icon: fa-tasks
    show_in_menu: true
    menu_order: 1
    is_active: true
    allow_create: true
    allow_edit: true
    allow_delete: true
    search_enabled: true
    columns:
      - name: title
        label: Title
        field_type: string
        required: true
        order: 1
        show_in_list: true
        show_in_form: true
      - name: status
        label: Status
        field_type: select
        required: false
        choices: "open,in_progress,done"
        order: 2
        show_in_list: true
        show_in_form: true
      - name: due_date
        label: Due Date
        field_type: date
        required: false
        order: 3
        show_in_list: true
        show_in_form: true
