{# Redesigned Logs Partial #}
{% include 'admin/setting/_setting_dev_nav.html' %}
<div class="hitech-card">
    <div class="hitech-card-header">
        <h3 class="hitech-card-title">SYSTEM_LOG_VIEWER</h3>
        <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="log-search" class="hitech-input" placeholder="Filter logs..." style="width: 200px;">
            <select id="log-level" class="hitech-select">
                <option value="">ALL_LEVELS</option>
                <option value="DEBUG">DEBUG</option>
                <option value="INFO">INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="ERROR">ERROR</option>
                <option value="CRITICAL">CRITICAL</option>
            </select>
            <button class="hitech-btn hitech-btn-primary" onclick="refreshLogs()">
                <i class="fa fa-refresh"></i> REFRESH
            </button>
        </div>
    </div>
    <div class="hitech-card-body" style="padding: 0;">
        <div class="hitech-console" id="log-container" style="height: 600px; border: none; border-radius: 0;">
            <div style="color: var(--hitech-text-dim);">Initializing log stream...</div>
        </div>
    </div>
</div>

<script>
    async function refreshLogs() {
        const container = document.getElementById('log-container');
        if (!container) return;
        const level = document.getElementById('log-level').value;
        const search = document.getElementById('log-search').value;
        
        container.innerHTML = '<div style="color: var(--hitech-accent-cyan);">Fetching logs...</div>';
        
        try {
            const resp = await fetch(`/admin/api/dev/logs?level=${level}&search=${search}`);
            const data = await resp.json();
            
            if (data.error) {
                container.innerHTML = `<div style="color: var(--hitech-danger);">ERROR: ${data.error}</div>`;
                return;
            }
            
            if (data.logs.length === 0) {
                container.innerHTML = '<div style="color: var(--hitech-text-dim);">No logs found matching criteria.</div>';
                return;
            }
            
            container.innerHTML = data.logs.map(log => {
                let color = '#fff';
                if (log.level === 'ERROR' || log.level === 'CRITICAL') color = 'var(--hitech-danger)';
                else if (log.level === 'WARNING') color = 'var(--hitech-warning)';
                else if (log.level === 'DEBUG') color = '#666';
                
                return `
                    <div style="margin-bottom: 0.5rem; font-size: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.3rem;">
                        <span style="color: #444;">[${log.timestamp}]</span>
                        <span style="color: var(--hitech-accent-cyan); font-weight: 600;">${log.level.padEnd(8)}</span>
                        <span style="color: var(--hitech-accent);">${log.logger}</span>
                        <span style="color: #666;">@ ${log.source}</span>
                        <div style="color: ${color}; margin-top: 0.1rem; padding-left: 1rem; opacity: 0.9;">${log.message}</div>
                    </div>
                `;
            }).join('');
        } catch (e) {
            container.innerHTML = `<div style="color: var(--hitech-danger);">FETCH_ERROR: ${e.message}</div>`;
        }
    }

    document.getElementById('log-search').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') refreshLogs();
    });
    document.getElementById('log-level').addEventListener('change', refreshLogs);

    refreshLogs();
</script>
