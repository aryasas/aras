{# Redesigned SQL Console Partial #}
{% include 'admin/setting/_setting_dev_nav.html' %}
<div style="display: grid; grid-template-columns: 250px 1fr; gap: 1.5rem;">
    <!-- Sidebar: Schema Browser -->
    <div class="hitech-card">
        <div class="hitech-card-header">
            <h3 class="hitech-card-title">SCHEMA_BROWSER</h3>
        </div>
        <div class="hitech-card-body" style="padding: 0; max-height: 700px; overflow-y: auto;">
            <div id="schema-list" class="hitech-mono" style="font-size: 0.75rem; padding: 0.5rem;">
                <div style="color: var(--hitech-text-dim);">Loading schema...</div>
            </div>
        </div>
    </div>

    <!-- Main: SQL Editor & Results -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="hitech-card">
            <div class="hitech-card-header">
                <h3 class="hitech-card-title">SQL_QUERY_EDITOR</h3>
                <span class="hitech-badge hitech-badge-warning" style="font-size: 0.65rem;">READ_ONLY_MODE</span>
            </div>
            <div class="hitech-card-body" style="padding: 0;">
                <textarea id="sql-query" class="hitech-console" style="width: 100%; height: 150px; border: none; border-radius: 0; resize: vertical;" placeholder="SELECT * FROM users LIMIT 10;"></textarea>
                <div class="hitech-card-header" style="border-top: 1px solid var(--hitech-border); border-bottom: none;">
                    <span id="query-status" style="font-size: 0.75rem; color: var(--hitech-text-dim);">Ready.</span>
                    <button class="hitech-btn hitech-btn-primary" onclick="executeQuery()">
                        <i class="fa fa-play"></i> EXECUTE_SQL
                    </button>
                </div>
            </div>
        </div>

        <div class="hitech-card">
            <div class="hitech-card-header">
                <h3 class="hitech-card-title">QUERY_RESULTS</h3>
                <div id="result-meta" style="font-size: 0.75rem; color: var(--hitech-accent-cyan);"></div>
            </div>
            <div class="hitech-card-body" style="padding: 0; overflow-x: auto;">
                <div id="result-container" style="max-height: 400px; overflow-y: auto;">
                    <div style="padding: 2rem; text-align: center; color: var(--hitech-text-dim);">
                        Execute a query to see results.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadSchema() {
        const list = document.getElementById('schema-list');
        if (!list) return;
        try {
            const resp = await fetch('/admin/api/dev/sql/schema');
            const data = await resp.json();
            
            if (data.error) {
                list.innerHTML = `<div style="color: var(--hitech-danger);">${data.error}</div>`;
                return;
            }
            
            list.innerHTML = Object.entries(data.schema).map(([table, cols]) => `
                <div style="margin-bottom: 0.8rem;">
                    <div style="color: var(--hitech-accent-cyan); cursor: pointer; font-weight: 600;" 
                         onclick="toggleTable('${table}')"
                         oncontextmenu="showTableMenu(event, '${table}')">
                        <i class="fa fa-table"></i> ${table}
                    </div>
                    <div id="cols-${table}" style="display: none; padding-left: 1rem; border-left: 1px solid var(--hitech-border); margin-top: 0.2rem;">
                        ${cols.map(c => `
                            <div style="color: var(--hitech-text-dim); margin-bottom: 0.1rem;">
                                ${c.name} <span style="opacity: 0.5;">[${c.type}]</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        } catch (e) {
            list.innerHTML = `<div style="color: var(--hitech-danger);">ERROR: ${e.message}</div>`;
        }
    }

    function toggleTable(table) {
        const el = document.getElementById(`cols-${table}`);
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    async function executeQuery() {
        const query = document.getElementById('sql-query').value;
        const status = document.getElementById('query-status');
        const container = document.getElementById('result-container');
        const meta = document.getElementById('result-meta');
        
        if (!query.trim()) return;
        
        status.innerHTML = '<span style="color: var(--hitech-accent-cyan);">Executing...</span>';
        container.innerHTML = '<div style="padding: 2rem; text-align: center;">Wait...</div>';
        
        try {
            const resp = await fetch('/admin/api/dev/sql/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const data = await resp.json();
            
            if (data.error) {
                status.innerHTML = `<span style="color: var(--hitech-danger);">FAILED</span>`;
                container.innerHTML = `<div style="padding: 1.5rem; color: var(--hitech-danger); background: rgba(218, 54, 51, 0.1); font-family: var(--hitech-mono);">${data.error}</div>`;
                meta.innerHTML = '';
                return;
            }
            
            status.innerHTML = '<span style="color: var(--hitech-success);">SUCCESS</span>';
            meta.innerHTML = `ROWS: ${data.count} ${data.truncated ? '(TRUNCATED_@_1000)' : ''}`;
            
            if (data.rows.length === 0) {
                container.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--hitech-text-dim);">Empty set returned.</div>';
                return;
            }
            
            let html = '<table class="hitech-table"><thead><tr>';
            data.columns.forEach(c => html += `<th>${c}</th>`);
            html += '</tr></thead><tbody>';
            
            data.rows.forEach(row => {
                html += '<tr>';
                data.columns.forEach(c => {
                    const val = row[c];
                    let displayVal = val;
                    if (val === null) {
                        displayVal = '<i style="opacity:0.5">null</i>';
                    } else if (typeof val === 'object') {
                        displayVal = JSON.stringify(val);
                    }
                    html += `<td style="white-space: nowrap;">${displayVal}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            
        } catch (e) {
            status.innerHTML = `<span style="color: var(--hitech-danger);">FETCH_ERROR</span>`;
            container.innerHTML = `<div style="padding: 1.5rem; color: var(--hitech-danger);">${e.message}</div>`;
        }
    }

    // Ctrl+Enter to execute
    if (document.getElementById('sql-query')) {
        document.getElementById('sql-query').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') executeQuery();
        });
        loadSchema();
    }

    function showTableMenu(e, table) {
        e.preventDefault();
        let menu = document.getElementById('table-menu');
        if (!menu) {
            menu = document.createElement('div');
            menu.id = 'table-menu';
            menu.style.position = 'absolute';
            menu.style.background = 'var(--hitech-bg)';
            menu.style.border = '1px solid var(--hitech-border)';
            menu.style.padding = '5px';
            menu.style.zIndex = '1000';
            menu.style.boxShadow = '2px 2px 10px rgba(0,0,0,0.5)';
            document.body.appendChild(menu);
        }
        // Use a wrapper that ensures the string is passed correctly
        menu.innerHTML = `<div style="padding: 5px; cursor: pointer;" onclick="runSql('SELECT * FROM ${table} LIMIT 100;')">SELECT * FROM ${table}</div>`;
        menu.style.left = e.pageX + 'px';
        menu.style.top = e.pageY + 'px';
        menu.style.display = 'block';
        
        document.addEventListener('click', () => menu.style.display = 'none', { once: true });
    }

    function runSql(queryText) {
        document.getElementById('sql-query').value = String(queryText);
        executeQuery();
    }
</script>
