<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Tabbed Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-sm text-gray-800">
    <div class="max-w-6xl mx-auto p-6">
        <!-- Header -->
        <div class="flex justify-between items-end mb-6">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-blue-600 text-white rounded-lg flex items-center justify-center text-2xl font-bold">
                    P
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Project Alpha Upgrade</h1>
                    <p class="text-gray-500">Status: <span class="text-green-600 font-medium">In Progress</span> &bull; ID: PRJ-0092</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button class="px-4 py-2 bg-white border border-gray-300 rounded shadow-sm hover:bg-gray-50 text-gray-700">Save Draft</button>
                <button class="px-4 py-2 bg-blue-600 text-white rounded shadow-sm hover:bg-blue-700">Submit for Approval</button>
            </div>
        </div>

        <!-- Tabbed Interface -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <!-- Tabs -->
            <div class="border-b border-gray-200 px-6 pt-4 flex gap-6">
                <button class="pb-3 text-blue-600 font-medium border-b-2 border-blue-600">Overview</button>
                <button class="pb-3 text-gray-500 hover:text-gray-700 font-medium border-b-2 border-transparent">Tasks</button>
                <button class="pb-3 text-gray-500 hover:text-gray-700 font-medium border-b-2 border-transparent">Budget & Expenses</button>
                <button class="pb-3 text-gray-500 hover:text-gray-700 font-medium border-b-2 border-transparent">Team Members</button>
                <button class="pb-3 text-gray-500 hover:text-gray-700 font-medium border-b-2 border-transparent">Documents</button>
            </div>

            <!-- Tab Content -->
            <div class="p-6">
                <div class="grid grid-cols-3 gap-8">
                    <!-- Main Info -->
                    <div class="col-span-2 space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Project Description</label>
                            <textarea rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">Upgrading the legacy CRM to the new Alpha framework. Expected to take 3 months.</textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                                <input type="date" value="2023-09-01" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Target End Date</label>
                                <input type="date" value="2023-12-01" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Sidebar Info -->
                    <div class="space-y-6 bg-gray-50 p-5 rounded-lg border border-gray-100">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Project Manager</label>
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">SJ</div>
                                <span class="font-medium text-gray-900">Sarah Jenkins</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Total Budget</label>
                            <div class="text-xl font-bold text-gray-900">$150,000.00</div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Priority</label>
                            <select class="w-full px-3 py-1.5 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 bg-white text-sm">
                                <option>High</option>
                                <option>Medium</option>
                                <option>Low</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
