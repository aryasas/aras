<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Dense Data Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-sm text-gray-800">
    <div class="p-6 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-semibold text-gray-900">Inventory Items</h1>
            <div class="flex gap-2">
                <button class="px-4 py-2 bg-white border border-gray-300 rounded shadow-sm hover:bg-gray-50"><i class="fas fa-filter mr-2"></i>Filter</button>
                <button class="px-4 py-2 bg-white border border-gray-300 rounded shadow-sm hover:bg-gray-50"><i class="fas fa-file-export mr-2"></i>Export</button>
                <button class="px-4 py-2 bg-blue-600 text-white rounded shadow-sm hover:bg-blue-700"><i class="fas fa-plus mr-2"></i>New Item</button>
            </div>
        </div>
        
        <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
            <div class="p-4 border-b border-gray-200 flex justify-between">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
                    <input type="text" placeholder="Search items..." class="pl-9 pr-4 py-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 w-64">
                </div>
                <div class="text-sm text-gray-500 flex items-center">
                    Showing 1-10 of 1,240 items
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-xs uppercase tracking-wider text-gray-500">
                            <th class="p-3 w-10 text-center"><input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"></th>
                            <th class="p-3 font-medium">SKU <i class="fas fa-sort ml-1"></i></th>
                            <th class="p-3 font-medium">Product Name <i class="fas fa-sort ml-1"></i></th>
                            <th class="p-3 font-medium">Category</th>
                            <th class="p-3 font-medium text-right">In Stock</th>
                            <th class="p-3 font-medium text-right">Unit Price</th>
                            <th class="p-3 font-medium text-center">Status</th>
                            <th class="p-3 font-medium">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <!-- Row 1 -->
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="p-3 text-center"><input type="checkbox" class="rounded border-gray-300 text-blue-600"></td>
                            <td class="p-3 font-medium text-blue-600 cursor-pointer">SKU-1001</td>
                            <td class="p-3">ThinkPad T14 Gen 3</td>
                            <td class="p-3">Laptops</td>
                            <td class="p-3 text-right">45</td>
                            <td class="p-3 text-right">$1,299.00</td>
                            <td class="p-3 text-center"><span class="px-2 py-1 bg-green-100 text-green-800 rounded-full text-xs font-medium">Active</span></td>
                            <td class="p-3">
                                <button class="text-gray-400 hover:text-blue-600 mr-2"><i class="fas fa-edit"></i></button>
                                <button class="text-gray-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                        <!-- Row 2 -->
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="p-3 text-center"><input type="checkbox" class="rounded border-gray-300 text-blue-600"></td>
                            <td class="p-3 font-medium text-blue-600 cursor-pointer">SKU-1002</td>
                            <td class="p-3">Dell UltraSharp 27"</td>
                            <td class="p-3">Monitors</td>
                            <td class="p-3 text-right text-red-600 font-medium">2</td>
                            <td class="p-3 text-right">$450.00</td>
                            <td class="p-3 text-center"><span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-medium">Low Stock</span></td>
                            <td class="p-3">
                                <button class="text-gray-400 hover:text-blue-600 mr-2"><i class="fas fa-edit"></i></button>
                                <button class="text-gray-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                        <!-- Row 3 -->
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="p-3 text-center"><input type="checkbox" class="rounded border-gray-300 text-blue-600"></td>
                            <td class="p-3 font-medium text-blue-600 cursor-pointer">SKU-1003</td>
                            <td class="p-3">Logitech MX Master 3</td>
                            <td class="p-3">Accessories</td>
                            <td class="p-3 text-right">120</td>
                            <td class="p-3 text-right">$99.00</td>
                            <td class="p-3 text-center"><span class="px-2 py-1 bg-green-100 text-green-800 rounded-full text-xs font-medium">Active</span></td>
                            <td class="p-3">
                                <button class="text-gray-400 hover:text-blue-600 mr-2"><i class="fas fa-edit"></i></button>
                                <button class="text-gray-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end">
                <nav class="flex gap-1">
                    <button class="px-3 py-1 border border-gray-300 rounded bg-gray-50 text-gray-400 cursor-not-allowed">Prev</button>
                    <button class="px-3 py-1 border border-blue-500 rounded bg-blue-50 text-blue-600">1</button>
                    <button class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">2</button>
                    <button class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">3</button>
                    <button class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">Next</button>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
