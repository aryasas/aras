<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Card Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-sm text-gray-800">
    <div class="p-6 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-semibold text-gray-900">Employee Directory</h1>
            <div class="flex gap-2">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
                    <input type="text" placeholder="Search employees..." class="pl-9 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 w-64 bg-white shadow-sm">
                </div>
                <button class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow-sm hover:bg-blue-700"><i class="fas fa-user-plus mr-2"></i>Add Employee</button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Card 1 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow">
                <div class="h-24 bg-blue-600 relative">
                    <img src="https://i.pravatar.cc/150?u=1" class="w-16 h-16 rounded-full border-4 border-white absolute -bottom-8 left-1/2 transform -translate-x-1/2 object-cover">
                </div>
                <div class="pt-10 pb-4 px-4 text-center">
                    <h3 class="text-lg font-bold text-gray-900">Sarah Jenkins</h3>
                    <p class="text-blue-600 text-sm font-medium mb-1">Engineering Manager</p>
                    <p class="text-gray-500 text-xs mb-4"><i class="fas fa-map-marker-alt mr-1"></i> New York Office</p>
                    
                    <div class="flex justify-center gap-3 border-t border-gray-100 pt-4">
                        <button class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 hover:bg-blue-100 hover:text-blue-600 flex items-center justify-center"><i class="fas fa-envelope"></i></button>
                        <button class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 hover:bg-blue-100 hover:text-blue-600 flex items-center justify-center"><i class="fas fa-phone"></i></button>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow">
                <div class="h-24 bg-green-600 relative">
                    <img src="https://i.pravatar.cc/150?u=2" class="w-16 h-16 rounded-full border-4 border-white absolute -bottom-8 left-1/2 transform -translate-x-1/2 object-cover">
                </div>
                <div class="pt-10 pb-4 px-4 text-center">
                    <h3 class="text-lg font-bold text-gray-900">David Chen</h3>
                    <p class="text-green-600 text-sm font-medium mb-1">Senior UX Designer</p>
                    <p class="text-gray-500 text-xs mb-4"><i class="fas fa-map-marker-alt mr-1"></i> Remote (CA)</p>
                    
                    <div class="flex justify-center gap-3 border-t border-gray-100 pt-4">
                        <button class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 hover:bg-green-100 hover:text-green-600 flex items-center justify-center"><i class="fas fa-envelope"></i></button>
                        <button class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 hover:bg-green-100 hover:text-green-600 flex items-center justify-center"><i class="fas fa-phone"></i></button>
                    </div>
                </div>
            </div>
            
            <!-- Card 3 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow">
                <div class="h-24 bg-purple-600 relative">
                    <img src="https://i.pravatar.cc/150?u=3" class="w-16 h-16 rounded-full border-4 border-white absolute -bottom-8 left-1/2 transform -translate-x-1/2 object-cover">
                </div>
                <div class="pt-10 pb-4 px-4 text-center">
                    <h3 class="text-lg font-bold text-gray-900">Michael Ross</h3>
                    <p class="text-purple-600 text-sm font-medium mb-1">VP of Sales</p>
                    <p class="text-gray-500 text-xs mb-4"><i class="fas fa-map-marker-alt mr-1"></i> Chicago Office</p>
                    
                    <div class="flex justify-center gap-3 border-t border-gray-100 pt-4">
                        <button class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 hover:bg-purple-100 hover:text-purple-600 flex items-center justify-center"><i class="fas fa-envelope"></i></button>
                        <button class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 hover:bg-purple-100 hover:text-purple-600 flex items-center justify-center"><i class="fas fa-phone"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
