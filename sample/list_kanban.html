<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Kanban Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-sm text-gray-800 h-screen flex flex-col">
    <div class="p-6 pb-2">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-semibold text-gray-900">Sales Pipeline</h1>
            <div class="flex gap-2">
                <button class="px-4 py-2 bg-blue-600 text-white rounded shadow-sm hover:bg-blue-700"><i class="fas fa-plus mr-2"></i>New Deal</button>
            </div>
        </div>
    </div>
    
    <div class="flex-1 overflow-x-auto p-6 pt-0 flex gap-6 items-start">
        <!-- Column 1 -->
        <div class="bg-gray-200 rounded-lg w-80 flex-shrink-0 flex flex-col max-h-full">
            <div class="p-3 flex justify-between items-center border-b border-gray-300">
                <h3 class="font-semibold text-gray-700">Lead In <span class="bg-gray-300 text-gray-600 text-xs px-2 py-0.5 rounded-full ml-2">3</span></h3>
                <span class="text-gray-500 text-sm font-medium">$12,000</span>
            </div>
            <div class="p-3 overflow-y-auto flex-1 flex flex-col gap-3">
                <!-- Card -->
                <div class="bg-white p-4 rounded shadow-sm border border-gray-200 cursor-pointer hover:border-blue-400">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold text-purple-600 bg-purple-100 px-2 py-0.5 rounded">Software</span>
                        <i class="fas fa-ellipsis-h text-gray-400"></i>
                    </div>
                    <h4 class="font-medium text-gray-900 mb-1">Acme Corp ERP Upgrade</h4>
                    <p class="text-gray-500 text-xs mb-3">Acme Corporation</p>
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-bold text-gray-700">$5,000</span>
                        <div class="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center text-xs">JD</div>
                    </div>
                </div>
                <!-- Card -->
                <div class="bg-white p-4 rounded shadow-sm border border-gray-200 cursor-pointer hover:border-blue-400">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold text-orange-600 bg-orange-100 px-2 py-0.5 rounded">Hardware</span>
                    </div>
                    <h4 class="font-medium text-gray-900 mb-1">Server Replacements</h4>
                    <p class="text-gray-500 text-xs mb-3">TechNova Inc.</p>
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-bold text-gray-700">$7,000</span>
                        <div class="w-6 h-6 rounded-full bg-green-500 text-white flex items-center justify-center text-xs">AS</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Column 2 -->
        <div class="bg-gray-200 rounded-lg w-80 flex-shrink-0 flex flex-col max-h-full">
            <div class="p-3 flex justify-between items-center border-b border-gray-300">
                <h3 class="font-semibold text-gray-700">Negotiation <span class="bg-gray-300 text-gray-600 text-xs px-2 py-0.5 rounded-full ml-2">1</span></h3>
                <span class="text-gray-500 text-sm font-medium">$25,000</span>
            </div>
            <div class="p-3 overflow-y-auto flex-1 flex flex-col gap-3">
                <div class="bg-white p-4 rounded shadow-sm border border-gray-200 cursor-pointer hover:border-blue-400 border-l-4 border-l-yellow-400">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold text-blue-600 bg-blue-100 px-2 py-0.5 rounded">Consulting</span>
                    </div>
                    <h4 class="font-medium text-gray-900 mb-1">Cloud Migration Strategy</h4>
                    <p class="text-gray-500 text-xs mb-3">Global Logistics LLC</p>
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-bold text-gray-700">$25,000</span>
                        <div class="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center text-xs">JD</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Column 3 -->
        <div class="bg-gray-200 rounded-lg w-80 flex-shrink-0 flex flex-col max-h-full">
            <div class="p-3 flex justify-between items-center border-b border-gray-300">
                <h3 class="font-semibold text-gray-700">Won <span class="bg-gray-300 text-gray-600 text-xs px-2 py-0.5 rounded-full ml-2">2</span></h3>
                <span class="text-green-600 text-sm font-bold">$18,500</span>
            </div>
            <div class="p-3 overflow-y-auto flex-1 flex flex-col gap-3">
                <div class="bg-white p-4 rounded shadow-sm border border-gray-200 cursor-pointer opacity-75">
                    <h4 class="font-medium text-gray-900 mb-1 line-through text-gray-500">Q3 Office Supplies</h4>
                    <div class="flex justify-between items-center text-sm mt-3">
                        <span class="font-bold text-green-600">$1,500</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
