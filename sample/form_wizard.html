<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Wizard Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-sm text-gray-800">
    <div class="p-6 max-w-3xl mx-auto mt-10">
        
        <!-- Stepper -->
        <div class="mb-8">
            <h1 class="text-2xl font-semibold text-gray-900 mb-6 text-center">Onboard New Employee</h1>
            <div class="flex items-center justify-between relative">
                <!-- Line -->
                <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-gray-200 z-0"></div>
                <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-1/3 h-1 bg-blue-600 z-0"></div>

                <!-- Step 1 -->
                <div class="relative z-10 flex flex-col items-center">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold border-4 border-white shadow">
                        <i class="fas fa-check"></i>
                    </div>
                    <span class="mt-2 text-xs font-medium text-blue-600">Personal Info</span>
                </div>
                <!-- Step 2 -->
                <div class="relative z-10 flex flex-col items-center">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold border-4 border-white shadow">
                        2
                    </div>
                    <span class="mt-2 text-xs font-medium text-blue-600">Employment Details</span>
                </div>
                <!-- Step 3 -->
                <div class="relative z-10 flex flex-col items-center">
                    <div class="w-10 h-10 bg-gray-200 text-gray-500 rounded-full flex items-center justify-center font-bold border-4 border-white">
                        3
                    </div>
                    <span class="mt-2 text-xs font-medium text-gray-500">Payroll & Tax</span>
                </div>
                <!-- Step 4 -->
                <div class="relative z-10 flex flex-col items-center">
                    <div class="w-10 h-10 bg-gray-200 text-gray-500 rounded-full flex items-center justify-center font-bold border-4 border-white">
                        4
                    </div>
                    <span class="mt-2 text-xs font-medium text-gray-500">Review</span>
                </div>
            </div>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <div class="p-6">
                <h2 class="text-xl font-medium text-gray-900 mb-6">Employment Details</h2>
                
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Job Title <span class="text-red-500">*</span></label>
                        <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" value="Senior Software Engineer">
                    </div>

                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 bg-white">
                                <option>Engineering</option>
                                <option>Sales</option>
                                <option>Marketing</option>
                                <option>HR</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Direct Manager</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 bg-white">
                                <option>Sarah Jenkins</option>
                                <option>David Chen</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Employment Type</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 bg-white">
                                <option>Full-Time</option>
                                <option>Part-Time</option>
                                <option>Contractor</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                            <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 rounded-b-lg flex justify-between">
                <button class="px-4 py-2 bg-white border border-gray-300 rounded shadow-sm hover:bg-gray-50 text-gray-700">Back</button>
                <button class="px-4 py-2 bg-blue-600 text-white rounded shadow-sm hover:bg-blue-700">Next Step</button>
            </div>
        </div>
    </div>
</body>
</html>
